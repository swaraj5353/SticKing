<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Vehicle Tattoo & Decal Customizer</title>
<style>
  :root {
    --bg: #0a0a12;
    --bg-panel: #14141f;
    --cyan: #00fff2;
    --magenta: #ff2ee6;
    --red: #ff2b4e;
    --text: #f2f2fb;
    --text-dim: #b8b8cc;
    --border: rgba(0, 255, 242, 0.3);
  }
  body {
    font-family: Arial, sans-serif; max-width: 520px; margin: 30px auto; padding: 0 16px;
    background: var(--bg); color: var(--text);
  }
  h2 { margin-bottom: 4px; color: #ffffff; text-shadow: 0 0 6px var(--cyan), 0 0 18px rgba(0, 255, 242, 0.4); }
  p.sub { color: var(--text-dim); margin-top: 0; }
  label { display: block; margin-top: 16px; font-weight: bold; color: var(--text); }
  input[type="file"], input[type="text"], input[type="number"], select, textarea {
    width: 100%; padding: 10px; margin-top: 6px; border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box;
    font-family: inherit; font-size: 14px; background: var(--bg-panel); color: var(--text);
  }
  input::placeholder, textarea::placeholder { color: var(--text-dim); }
  select option { background: var(--bg-panel); color: var(--text); }
  textarea { resize: vertical; min-height: 60px; }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }
  button {
    margin-top: 20px; width: 100%; padding: 12px; color: white;
    border: none; border-radius: 6px; font-size: 16px; cursor: pointer;
    background: linear-gradient(135deg, var(--red), var(--magenta));
    box-shadow: 0 0 10px rgba(255, 43, 78, 0.5), 0 0 22px rgba(255, 46, 230, 0.3);
    text-shadow: 0 0 6px rgba(255,255,255,0.4);
    transition: box-shadow 0.2s ease, transform 0.15s ease;
  }
  button:hover:not(:disabled) {
    box-shadow: 0 0 16px rgba(255, 43, 78, 0.8), 0 0 34px rgba(255, 46, 230, 0.5);
    transform: translateY(-1px);
  }
  button.secondary { background: transparent; border: 1px solid var(--cyan); color: var(--cyan); box-shadow: 0 0 8px rgba(0, 255, 242, 0.35); text-shadow: none; }
  button.decal { background: transparent; border: 1px solid #3dffa0; color: #3dffa0; box-shadow: 0 0 8px rgba(61, 255, 160, 0.35); text-shadow: none; }
  button:disabled { background: #333; color: #888; box-shadow: none; cursor: not-allowed; }
  #status { margin-top: 14px; color: var(--text); font-size: 14px; }
  #result { margin-top: 20px; text-align: center; }
  #result img { max-width: 100%; border-radius: 8px; border: 1px solid var(--border); box-shadow: 0 0 16px rgba(0, 255, 242, 0.2); }
  #refineBox, #decalBox { display: none; margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border); }
  #decalStatus { color: var(--text); font-size: 14px; margin-top: 10px; }
  #decalResult { margin-top: 14px; text-align: center; }
  #decalResult img { max-width: 100%; border-radius: 8px; background: repeating-conic-gradient(#2a2a35 0% 25%, #1b1b24 0% 50%) 50% / 20px 20px; border: 1px solid var(--border); }
  a.download-link { display: inline-block; margin-top: 10px; color: var(--cyan); }
  a.download-link:hover { color: var(--magenta); }
  #cropSection { display: none; margin-top: 16px; }
  #cropCanvas { max-width: 100%; border: 1px solid var(--border); border-radius: 6px; cursor: crosshair; touch-action: none; }
  #cropHint { font-size: 13px; color: var(--text-dim); margin-top: 6px; }

</style>
</head>
<body>
  <h2>Vehicle Tattoo & Decal Customizer</h2>
  <p class="sub">Upload a photo of the panel, tell us the size and design — we'll generate a fitted preview.</p>

  <form id="previewForm">
    <label for="vehiclePhoto">Photo of the vehicle or specific part</label>
    <input type="file" id="vehiclePhoto" name="vehiclePhoto" accept="image/*" required />

    <div id="cropSection">
      <label>Drag the box to select just the panel/area for the design</label>
      <canvas id="cropCanvas"></canvas>
      <p id="cropHint">Drag inside the box to move it. Drag the corner handle to resize.</p>
    </div>

    <label for="part">Which part is this?</label>
    <select id="part" name="part">
      <option value="bonnet">Bonnet</option>
      <option value="door">Door</option>
      <option value="fender">Fender</option>
      <option value="fuel tank">Fuel Tank</option>
      <option value="side panel">Side Panel</option>
      <option value="whole vehicle">Whole Vehicle</option>
      <option value="other">Other</option>
    </select>

    <div class="row">
      <div>
        <label for="widthCm">Width (cm)</label>
        <input type="number" id="widthCm" name="widthCm" placeholder="e.g. 120" />
      </div>
      <div>
        <label for="heightCm">Height (cm)</label>
        <input type="number" id="heightCm" name="heightCm" placeholder="e.g. 45" />
      </div>
    </div>

    <label for="description">Describe the tattoo/design</label>
    <textarea id="description" name="description" placeholder="e.g. roaring lion, black with red outline, aggressive style" required></textarea>

    <button type="submit" id="submitBtn">Generate Preview</button>
  </form>

  <div id="status"></div>
  <div id="result"></div>

  <!-- Shown after a preview is generated -->
  <div id="refineBox">
    <label for="refinement">Want changes? Describe them</label>
    <textarea id="refinement" placeholder="e.g. make it more aggressive, move it toward the rear, make it 20% smaller"></textarea>
    <button type="button" id="refineBtn" class="secondary">Refine This Preview</button>
  </div>

  <div id="decalBox">
    <button type="button" id="decalBtn" class="decal">Generate Print-Ready Decal (transparent background)</button>
    <div id="decalStatus"></div>
    <div id="decalResult"></div>
  </div>

  <script>
    const form = document.getElementById("previewForm");
    const statusEl = document.getElementById("status");
    const resultEl = document.getElementById("result");
    const submitBtn = document.getElementById("submitBtn");
    const refineBox = document.getElementById("refineBox");
    const decalBox = document.getElementById("decalBox");
    const refineBtn = document.getElementById("refineBtn");
    const decalBtn = document.getElementById("decalBtn");
    const fileInput = document.getElementById("vehiclePhoto");
    const cropSection = document.getElementById("cropSection");
    const cropCanvas = document.getElementById("cropCanvas");
    const cropCtx = cropCanvas.getContext("2d");

    let currentImageBase64 = null; // holds the latest generated preview for refining
    let loadedImage = null;        // the original full-resolution uploaded photo
    let displayScale = 1;          // ratio between canvas display size and real image size
    let crop = { x: 0, y: 0, w: 0, h: 0 }; // crop box in CANVAS (display) coordinates

    const HANDLE_SIZE = 14;

    // --- Load the chosen photo onto the crop canvas, with a default centered crop box ---
    fileInput.addEventListener("change", () => {
      const file = fileInput.files[0];
      if (!file) return;

      const img = new Image();
      img.onload = () => {
        loadedImage = img;

        const maxDisplayWidth = 480;
        displayScale = Math.min(1, maxDisplayWidth / img.width);
        cropCanvas.width = img.width * displayScale;
        cropCanvas.height = img.height * displayScale;

        // Default crop box: centered, 70% of the image
        crop.w = cropCanvas.width * 0.7;
        crop.h = cropCanvas.height * 0.7;
        crop.x = (cropCanvas.width - crop.w) / 2;
        crop.y = (cropCanvas.height - crop.h) / 2;

        cropSection.style.display = "block";
        drawCrop();
      };
      img.src = URL.createObjectURL(file);
    });

    function drawCrop() {
      cropCtx.clearRect(0, 0, cropCanvas.width, cropCanvas.height);
      cropCtx.drawImage(loadedImage, 0, 0, cropCanvas.width, cropCanvas.height);

      // Dim everything outside the crop box
      cropCtx.fillStyle = "rgba(0,0,0,0.45)";
      cropCtx.fillRect(0, 0, cropCanvas.width, crop.y); // top
      cropCtx.fillRect(0, crop.y + crop.h, cropCanvas.width, cropCanvas.height - crop.y - crop.h); // bottom
      cropCtx.fillRect(0, crop.y, crop.x, crop.h); // left
      cropCtx.fillRect(crop.x + crop.w, crop.y, cropCanvas.width - crop.x - crop.w, crop.h); // right

      // Crop box border
      cropCtx.strokeStyle = "#1a73e8";
      cropCtx.lineWidth = 2;
      cropCtx.strokeRect(crop.x, crop.y, crop.w, crop.h);

      // Resize handle (bottom-right corner)
      cropCtx.fillStyle = "#1a73e8";
      cropCtx.fillRect(crop.x + crop.w - HANDLE_SIZE / 2, crop.y + crop.h - HANDLE_SIZE / 2, HANDLE_SIZE, HANDLE_SIZE);
    }

    // --- Dragging / resizing the crop box (mouse + touch) ---
    let dragMode = null; // "move" | "resize" | null
    let dragStart = { x: 0, y: 0 };
    let cropStart = { x: 0, y: 0, w: 0, h: 0 };

    function getCanvasPos(e) {
      const rect = cropCanvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      // Account for the canvas being displayed at a different size than its internal resolution
      const scaleX = cropCanvas.width / rect.width;
      const scaleY = cropCanvas.height / rect.height;
      return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
    }

    function pointerDown(e) {
      if (!loadedImage) return;
      const pos = getCanvasPos(e);
      const nearHandle =
        Math.abs(pos.x - (crop.x + crop.w)) < HANDLE_SIZE &&
        Math.abs(pos.y - (crop.y + crop.h)) < HANDLE_SIZE;

      if (nearHandle) {
        dragMode = "resize";
      } else if (pos.x > crop.x && pos.x < crop.x + crop.w && pos.y > crop.y && pos.y < crop.y + crop.h) {
        dragMode = "move";
      } else {
        return;
      }
      dragStart = pos;
      cropStart = { ...crop };
      e.preventDefault();
    }

    function pointerMove(e) {
      if (!dragMode) return;
      const pos = getCanvasPos(e);
      const dx = pos.x - dragStart.x;
      const dy = pos.y - dragStart.y;

      if (dragMode === "move") {
        crop.x = Math.min(Math.max(0, cropStart.x + dx), cropCanvas.width - crop.w);
        crop.y = Math.min(Math.max(0, cropStart.y + dy), cropCanvas.height - crop.h);
      } else if (dragMode === "resize") {
        crop.w = Math.min(Math.max(30, cropStart.w + dx), cropCanvas.width - crop.x);
        crop.h = Math.min(Math.max(30, cropStart.h + dy), cropCanvas.height - crop.y);
      }
      drawCrop();
      e.preventDefault();
    }

    function pointerUp() {
      dragMode = null;
    }

    cropCanvas.addEventListener("mousedown", pointerDown);
    cropCanvas.addEventListener("mousemove", pointerMove);
    window.addEventListener("mouseup", pointerUp);
    cropCanvas.addEventListener("touchstart", pointerDown, { passive: false });
    cropCanvas.addEventListener("touchmove", pointerMove, { passive: false });
    window.addEventListener("touchend", pointerUp);

    // Produces a Blob of just the cropped area, at the photo's original resolution
    function getCroppedBlob() {
      return new Promise((resolve) => {
        const sx = crop.x / displayScale;
        const sy = crop.y / displayScale;
        const sw = crop.w / displayScale;
        const sh = crop.h / displayScale;

        const outCanvas = document.createElement("canvas");
        outCanvas.width = sw;
        outCanvas.height = sh;
        outCanvas.getContext("2d").drawImage(loadedImage, sx, sy, sw, sh, 0, 0, sw, sh);
        outCanvas.toBlob((blob) => resolve(blob), "image/png");
      });
    }

    function currentFormValues() {
      return {
        part: document.getElementById("part").value,
        widthCm: document.getElementById("widthCm").value,
        heightCm: document.getElementById("heightCm").value,
        description: document.getElementById("description").value,
      };
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      if (!loadedImage) {
        alert("Please choose a photo first.");
        return;
      }

      statusEl.textContent = "Generating your preview... this can take 15-30 seconds.";
      resultEl.innerHTML = "";
      refineBox.style.display = "none";
      decalBox.style.display = "none";
      submitBtn.disabled = true;

      try {
        const croppedBlob = await getCroppedBlob();
        const formData = new FormData();
        formData.append("vehiclePhoto", croppedBlob, "cropped.png");
        formData.append("part", document.getElementById("part").value);
        formData.append("widthCm", document.getElementById("widthCm").value);
        formData.append("heightCm", document.getElementById("heightCm").value);
        formData.append("description", document.getElementById("description").value);

        const res = await fetch("/generate-preview", { method: "POST", body: formData });
        const data = await res.json();

        if (data.success) {
          currentImageBase64 = data.image;
          statusEl.textContent = "Here's your preview:";
          resultEl.innerHTML = `<img src="${data.image}" alt="Generated preview" />`;
          refineBox.style.display = "block";
          decalBox.style.display = "block";
        } else {
          statusEl.textContent = "Error: " + data.error;
        }
      } catch (err) {
        statusEl.textContent = "Something went wrong. Please try again.";
      } finally {
        submitBtn.disabled = false;
      }
    });

    refineBtn.addEventListener("click", async () => {
      const refinement = document.getElementById("refinement").value.trim();
      if (!refinement) {
        alert("Describe what you'd like changed first.");
        return;
      }
      if (!currentImageBase64) return;

      statusEl.textContent = "Refining your preview...";
      refineBtn.disabled = true;

      try {
        const res = await fetch("/refine-preview", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            previousImageBase64: currentImageBase64,
            refinement,
            ...currentFormValues(),
          }),
        });
        const data = await res.json();

        if (data.success) {
          currentImageBase64 = data.image;
          statusEl.textContent = "Updated preview:";
          resultEl.innerHTML = `<img src="${data.image}" alt="Refined preview" />`;
          document.getElementById("refinement").value = "";
        } else {
          statusEl.textContent = "Error: " + data.error;
        }
      } catch (err) {
        statusEl.textContent = "Something went wrong refining the preview.";
      } finally {
        refineBtn.disabled = false;
      }
    });

    decalBtn.addEventListener("click", async () => {
      const decalStatus = document.getElementById("decalStatus");
      const decalResult = document.getElementById("decalResult");
      decalStatus.textContent = "Generating print-ready decal...";
      decalResult.innerHTML = "";
      decalBtn.disabled = true;

      try {
        const res = await fetch("/generate-decal", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ description: document.getElementById("description").value }),
        });
        const data = await res.json();

        if (data.success) {
          decalStatus.textContent = "Your print-ready decal (transparent background):";
          decalResult.innerHTML = `
            <img src="${data.image}" alt="Print-ready decal" />
            <br />
            <a class="download-link" href="${data.image}" download="decal.png">Download decal PNG</a>
          `;
        } else {
          decalStatus.textContent = "Error: " + data.error;
        }
      } catch (err) {
        decalStatus.textContent = "Something went wrong generating the decal.";
      } finally {
        decalBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
