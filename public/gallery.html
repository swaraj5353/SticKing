<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SticKing | Design Collection</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #03050b;
      --panel: rgba(8, 13, 24, 0.88);
      --panel2: rgba(13, 18, 31, 0.92);
      --pink: #ff1493;
      --pink2: #ff39b8;
      --cyan: #00f5ff;
      --purple: #8b2cff;
      --white: #f7f9ff;
      --muted: #8f98aa;
      --border: rgba(0, 245, 255, 0.20);
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--white);
      background:
        radial-gradient(circle at 15% 10%, rgba(255, 20, 147, 0.16), transparent 28%),
        radial-gradient(circle at 85% 15%, rgba(0, 245, 255, 0.12), transparent 30%),
        radial-gradient(circle at 50% 100%, rgba(111, 0, 255, 0.13), transparent 35%),
        #03050b;
      overflow-x: hidden;
    }

    /* Animated neon atmosphere */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;
      background:
        linear-gradient(
          110deg,
          transparent 0%,
          rgba(255, 20, 147, 0.025) 30%,
          rgba(0, 245, 255, 0.035) 50%,
          transparent 70%
        );
      background-size: 250% 100%;
      animation: atmosphere 10s linear infinite;
    }

    @keyframes atmosphere {
      0% {
        background-position: 0% 0;
      }
      100% {
        background-position: 250% 0;
      }
    }

    /* Top navigation */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 5%;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      background: rgba(2, 4, 10, 0.82);
      backdrop-filter: blur(18px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: white;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 20, 147, 0.7);
      box-shadow:
        0 0 15px rgba(255, 20, 147, 0.35),
        inset 0 0 15px rgba(0, 245, 255, 0.08);
      font-weight: 900;
      color: white;
    }

    .brand-text {
      font-size: 23px;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .brand-text span {
      color: var(--pink);
      text-shadow: 0 0 15px rgba(255, 20, 147, 0.7);
    }

    .brand-sub {
      font-size: 8px;
      color: #8892a5;
      letter-spacing: 1.5px;
      margin-top: 2px;
    }

    .home-btn {
      text-decoration: none;
      color: white;
      border: 1px solid rgba(255, 20, 147, 0.55);
      padding: 11px 20px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 700;
      transition: 0.25s ease;
      background: rgba(255, 20, 147, 0.05);
    }

    .home-btn:hover {
      background: rgba(255, 20, 147, 0.15);
      box-shadow: 0 0 22px rgba(255, 20, 147, 0.35);
      transform: translateY(-2px);
    }

    /* Hero */
    .hero {
      text-align: center;
      padding: 75px 20px 35px;
      position: relative;
    }

    .eyebrow {
      color: var(--cyan);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 5px;
      margin-bottom: 18px;
      text-shadow: 0 0 15px rgba(0, 245, 255, 0.8);
    }

    .hero h1 {
      font-size: clamp(42px, 6vw, 78px);
      line-height: 0.95;
      font-weight: 950;
      letter-spacing: -4px;
      text-transform: uppercase;
    }

    .hero h1 span {
      color: var(--pink);
      text-shadow:
        0 0 10px rgba(255, 20, 147, 0.7),
        0 0 35px rgba(255, 20, 147, 0.35);
    }

    .hero p {
      max-width: 680px;
      margin: 22px auto 0;
      color: #9ca5b8;
      font-size: 15px;
      line-height: 1.7;
    }

    .hero-line {
      width: 180px;
      height: 2px;
      margin: 30px auto 0;
      background: linear-gradient(
        90deg,
        transparent,
        var(--pink),
        var(--cyan),
        transparent
      );
      box-shadow:
        0 0 15px var(--pink),
        0 0 15px var(--cyan);
    }

    /* Category navigation */
    .categories {
      max-width: 1150px;
      margin: 30px auto 42px;
      padding: 0 20px;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .category-btn {
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.10);
      background: rgba(10, 15, 26, 0.72);
      color: #9da6b8;
      padding: 13px 20px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.5px;
      transition: 0.25s ease;
    }

    .category-btn:hover {
      color: white;
      border-color: rgba(0,245,255,0.45);
      box-shadow: 0 0 20px rgba(0,245,255,0.12);
    }

    .category-btn.active {
      color: white;
      border-color: var(--pink);
      background: rgba(255,20,147,0.10);
      box-shadow:
        0 0 15px rgba(255,20,147,0.28),
        inset 0 0 15px rgba(255,20,147,0.05);
    }

    /* Gallery */
    .gallery-wrap {
      width: min(1180px, 92%);
      margin: 0 auto 160px;
    }

    .collection-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      padding: 0 4px;
    }

    .collection-info h2 {
      font-size: 18px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .collection-info h2 span {
      color: var(--pink);
    }

    .count {
      color: #70798c;
      font-size: 12px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    /* Design card */
    .card {
      position: relative;
      overflow: hidden;
      min-height: 310px;
      background:
        linear-gradient(
          145deg,
          rgba(17, 24, 39, 0.96),
          rgba(5, 9, 17, 0.98)
        );
      border: 1px solid rgba(0,245,255,0.14);
      border-radius: 15px;
      box-shadow:
        0 15px 40px rgba(0,0,0,0.35),
        inset 0 1px rgba(255,255,255,0.04);
      transition:
        transform 0.3s ease,
        border-color 0.3s ease,
        box-shadow 0.3s ease;
      cursor: pointer;
    }

    .card::before {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      top: -100px;
      right: -80px;
      background: var(--cyan);
      filter: blur(80px);
      opacity: 0.08;
      pointer-events: none;
    }

    .card:hover {
      transform: translateY(-7px);
      border-color: rgba(255,20,147,0.65);
      box-shadow:
        0 20px 55px rgba(0,0,0,0.5),
        0 0 30px rgba(255,20,147,0.13);
    }

    .card.selected {
      border-color: var(--pink);
      box-shadow:
        0 0 0 1px var(--pink),
        0 0 35px rgba(255,20,147,0.25);
    }

    .image-box {
      height: 220px;
      margin: 10px;
      overflow: hidden;
      border-radius: 10px;
      background:
        radial-gradient(circle, #121b2a, #050810);
      border: 1px solid rgba(255,255,255,0.06);
      position: relative;
    }

    .image-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      transition: transform 0.45s ease;
    }

    .card:hover .image-box img {
      transform: scale(1.04);
    }

    .scanline {
      position: absolute;
      left: 0;
      right: 0;
      top: -20%;
      height: 35%;
      background: linear-gradient(
        transparent,
        rgba(0,245,255,0.10),
        transparent
      );
      pointer-events: none;
      animation: scan 4s linear infinite;
    }

    @keyframes scan {
      from {
        top: -35%;
      }
      to {
        top: 120%;
      }
    }

    .favorite {
      position: absolute;
      top: 18px;
      right: 18px;
      width: 34px;
      height: 34px;
      border-radius: 9px;
      display: grid;
      place-items: center;
      background: rgba(2,5,10,0.8);
      border: 1px solid rgba(255,255,255,0.18);
      color: #a9b1c0;
      font-size: 17px;
      z-index: 3;
      transition: 0.2s ease;
    }

    .favorite:hover,
    .favorite.active {
      color: var(--pink);
      border-color: var(--pink);
      box-shadow: 0 0 18px rgba(255,20,147,0.35);
    }

    .card-info {
      padding: 3px 17px 18px;
    }

    .card-name {
      font-size: 16px;
      font-weight: 850;
      margin-bottom: 10px;
    }

    .price {
      display: inline-block;
      padding: 6px 11px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 900;
      color: var(--pink);
      background: rgba(255,20,147,0.08);
      border: 1px solid rgba(255,20,147,0.25);
      text-shadow: 0 0 10px rgba(255,20,147,0.45);
    }

    /* Bottom selection bar */
    .selection-bar {
      position: fixed;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
      width: min(1050px, 92%);
      min-height: 78px;
      z-index: 90;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 12px 15px;
      background: rgba(4,7,15,0.90);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,20,147,0.55);
      border-radius: 15px;
      box-shadow:
        0 15px 50px rgba(0,0,0,0.6),
        0 0 30px rgba(255,20,147,0.12);
    }

    .selected-info {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .selected-thumb {
      width: 78px;
      height: 52px;
      border-radius: 7px;
      object-fit: cover;
      background: #090d16;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .selected-label {
      color: var(--pink);
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 2px;
      margin-bottom: 4px;
    }

    .selected-name {
      font-size: 16px;
      font-weight: 900;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 300px;
    }

    .selected-price {
      padding-left: 25px;
      border-left: 1px solid rgba(255,255,255,0.12);
    }

    .selected-price small {
      display: block;
      color: #7f889b;
      font-size: 9px;
      letter-spacing: 2px;
      margin-bottom: 3px;
    }

    .selected-price strong {
      color: var(--pink);
      font-size: 20px;
      text-shadow: 0 0 15px rgba(255,20,147,0.45);
    }

    .continue-btn {
      border: 0;
      cursor: pointer;
      min-width: 220px;
      padding: 15px 25px;
      border-radius: 9px;
      color: white;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 1.5px;
      background: linear-gradient(
        90deg,
        #d90072,
        #ff1493,
        #ff39b8
      );
      box-shadow:
        0 0 20px rgba(255,20,147,0.3),
        inset 0 1px rgba(255,255,255,0.25);
      transition: 0.25s ease;
    }

    .continue-btn:hover {
      transform: translateY(-2px);
      box-shadow:
        0 0 30px rgba(255,20,147,0.55),
        0 0 60px rgba(255,20,147,0.18);
    }

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 20px;
      color: #7c8598;
    }

    /* Responsive */
    @media (max-width: 1000px) {
      .gallery {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 760px) {
      .topbar {
        padding: 0 20px;
      }

      .brand-sub {
        display: none;
      }

      .home-btn {
        padding: 9px 13px;
        font-size: 11px;
      }

      .hero {
        padding-top: 50px;
      }

      .gallery {
        grid-template-columns: repeat(2, 1fr);
      }

      .selection-bar {
        flex-wrap: wrap;
      }

      .continue-btn {
        flex: 1;
        min-width: 150px;
      }

      .selected-price {
        display: none;
      }
    }

    @media (max-width: 500px) {
      .gallery {
        grid-template-columns: 1fr;
      }

      .hero h1 {
        letter-spacing: -2px;
      }

      .categories {
        gap: 7px;
      }

      .category-btn {
        padding: 10px 12px;
        font-size: 10px;
      }

      .selection-bar {
        bottom: 10px;
      }

      .selected-thumb {
        width: 55px;
        height: 42px;
      }

      .selected-name {
        max-width: 150px;
      }
    }
  </style>
</head>

    }

  ];


  let designs = fallbackDesigns;
  let currentCategory = "car-skin";
  let selectedDesign = null;


  const categoryNames = {

    "car-skin": {
      hero: "CAR SKIN",
      title: "Car Skin"
    },

    "windshield-window": {
      hero: "WINDSHIELD & WINDOW",
      title: "Windshield & Window"
    },

    "body-sticker": {
      hero: "BODY STICKER",
      title: "Body Sticker"
    },

    "bike-decal": {
      hero: "BIKE DECAL",
      title: "Bike Decal"
    }

  };


  /*
   ============================================================
   TRY TO LOAD designs.json
   If it exists, it will automatically be used.
   Otherwise fallbackDesigns are used.
   ============================================================
  */

  async function loadDesigns() {

    try {

      const response = await fetch("/designs.json", {
        cache: "no-store"
      });

      if (response.ok) {

        const data = await response.json();

        if (Array.isArray(data) && data.length > 0) {
          designs = data;
        }

      }

    } catch (error) {

      console.log(
        "designs.json not found. Using built-in designs."
      );

    }

    render();

  }


  /*
   ============================================================
   READ CATEGORY FROM URL
   Example:
   gallery.html?category=bike-decal
   ============================================================
  */

  function readCategoryFromURL() {

    const params =
      new URLSearchParams(window.location.search);

    const category =
      params.get("category");

    const validCategories = [
      "car-skin",
      "windshield-window",
      "body-sticker",
      "bike-decal"
    ];

    if (validCategories.includes(category)) {
      currentCategory = category;
    }

  }


  /*
   ============================================================
   UPDATE URL
   ============================================================
  */

  function updateURL(category) {

    const url =
      new URL(window.location.href);

    url.searchParams.set(
      "category",
      category
    );

    window.history.pushState(
      {},
      "",
      url
    );

  }


  /*
   ============================================================
   CHANGE CATEGORY
   ============================================================
  */

  function changeCategory(category) {

    currentCategory = category;

    updateURL(category);

    selectedDesign = null;

    render();

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }


  /*
   ============================================================
   RENDER GALLERY
   ============================================================
  */

  function render() {

    const gallery =
      document.getElementById("gallery");

    const filtered =
      designs.filter(
        design =>
          design.category === currentCategory
      );


    /* Update title */

    document.getElementById(
      "heroCategory"
    ).textContent =
      categoryNames[currentCategory].hero;


    document.getElementById(
      "collectionTitle"
    ).textContent =
      categoryNames[currentCategory].title;


    document.getElementById(
      "designCount"
    ).textContent =
      `${filtered.length} design${filtered.length === 1 ? "" : "s"}`;


    /* Active category */

    document
      .querySelectorAll(".category-btn")
      .forEach(button => {

        button.classList.toggle(
          "active",
          button.dataset.category === currentCategory
        );

      });


    /* No designs */

    if (filtered.length === 0) {

      gallery.innerHTML = `
        <div class="empty">
          <h2>No designs available yet.</h2>
          <p>Please check back soon.</p>
        </div>
      `;

      updateSelectionBar();

      return;
    }


    /* Create cards */

    gallery.innerHTML =
      filtered.map(design => {

        return `

          <article
            class="card"
            data-id="${design.id}"
            onclick="selectDesign('${design.id}')">

            <div class="image-box">

              <img
                src="${design.imageUrl}"
                alt="${escapeHTML(design.name)}"
                loading="lazy"
                onerror="this.style.display='none';">

              <div class="scanline"></div>

              <button
                class="favorite"
                onclick="toggleFavorite(event, '${design.id}')"
                aria-label="Favourite">

                ☆

              </button>

            </div>


            <div class="card-info">

              <div class="card-name">
                ${escapeHTML(design.name)}
              </div>

              <div class="price">
                ${escapeHTML(design.price)}
              </div>

            </div>

          </article>

        `;

      }).join("");


    /* Restore selection if still in current category */

    if (selectedDesign) {

      const exists =
        filtered.some(
          d => d.id === selectedDesign.id
        );

      if (!exists) {
        selectedDesign = null;
      }

    }


    updateSelectionBar();

  }


  /*
   ============================================================
   SELECT DESIGN
   ============================================================
  */

  function selectDesign(id) {

    const design =
      designs.find(
        item => item.id === id
      );

    if (!design) return;

    selectedDesign = design;

    document
      .querySelectorAll(".card")
      .forEach(card => {

        card.classList.toggle(
          "selected",
          card.dataset.id === id
        );

      });

    updateSelectionBar();

  }


  /*
   ============================================================
   SELECTION BAR
   ============================================================
  */

  function updateSelectionBar() {

    const thumb =
      document.getElementById("selectedThumb");

    const name =
      document.getElementById("selectedName");

    const price =
      document.getElementById("selectedPrice");


    if (!selectedDesign) {

      thumb.src = "";
      name.textContent = "Select a design";
      price.textContent = "—";

      return;

    }


    thumb.src =
      selectedDesign.imageUrl;

    name.textContent =
      selectedDesign.name;

    price.textContent =
      selectedDesign.price;

  }


  /*
   ============================================================
   FAVOURITE
   ============================================================
  */

  function toggleFavorite(event, id) {

    event.stopPropagation();

    const button =
      event.currentTarget;

    button.classList.toggle("active");

    button.textContent =
      button.classList.contains("active")
        ? "★"
        : "☆";

  }


  /*
   ============================================================
   CONTINUE BUTTON
   ============================================================
  */

  document
    .getElementById("continueBtn")
    .addEventListener("click", function() {

      if (!selectedDesign) {

        alert(
          "Please select a design first."
        );

        return;

      }


      /*
       Store selected design so your
       next page can use it.
      */

      localStorage.setItem(
        "selectedStickingDesign",
        JSON.stringify(selectedDesign)
      );


      /*
       Go back to your main customization page.

       If your preview/customizer is on
       another page, change index.html here.
      */

      window.location.href =
        "index.html?design=" +
        encodeURIComponent(
          selectedDesign.id
        );

    });


  /*
   ============================================================
   CATEGORY BUTTON EVENTS
   ============================================================
  */

  document
    .querySelectorAll(".category-btn")
    .forEach(button => {

      button.addEventListener(
        "click",
        function() {

          changeCategory(
            this.dataset.category
          );

        }
      );

    });


  /*
   ============================================================
   ESCAPE HTML
   ============================================================
  */

  function escapeHTML(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /*
   ============================================================
   INITIALIZE
   ============================================================
  */

  readCategoryFromURL();

  loadDesigns();

</script>

</body>
</html>
