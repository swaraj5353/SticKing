<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>SticKing — Choose Your Design</title>


<style>

/* =========================================================
   STICKING NEON THEME
   ========================================================= */

:root {

    --bg: #05060a;

    --panel: #0c1018;

    --panel2: #111722;

    --cyan: #00e5d4;

    --cyan-bright: #00fff0;

    --pink: #ff2e9f;

    --pink-bright: #ff4db3;

    --purple: #8b4dff;

    --red: #ff3b4d;

    --white: #f5f7fa;

    --muted: #9aa4b2;

    --border:
        rgba(255,255,255,0.09);

}


/* =========================================================
   GLOBAL
   ========================================================= */

* {

    box-sizing: border-box;

}


html {

    background: var(--bg);

    scroll-behavior: smooth;

}


body {

    margin: 0;

    padding: 0;

    min-height: 100vh;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    color: var(--white);

    background:

        radial-gradient(
            circle at 15% 0%,
            rgba(255,46,159,0.10),
            transparent 32%
        ),

        radial-gradient(
            circle at 85% 0%,
            rgba(0,229,212,0.10),
            transparent 32%
        ),

        radial-gradient(
            circle at 50% 100%,
            rgba(139,77,255,0.08),
            transparent 40%
        ),

        #05060a;

}


/* =========================================================
   BACKGROUND NEON GLOW
   ========================================================= */

body::before {

    content: "";

    position: fixed;

    inset: 0;

    pointer-events: none;

    z-index: -1;

    background:

        linear-gradient(
            90deg,
            transparent 0%,
            rgba(255,46,159,0.025) 50%,
            transparent 100%
        );

}


/* =========================================================
   MAIN PAGE
   ========================================================= */

.page {

    width:
        min(1200px, 92%);

    margin:
        0 auto;

    padding:
        70px 0 100px;

}


/* =========================================================
   HEADER
   ========================================================= */

.header {

    text-align: center;

    margin-bottom: 50px;

}


.eyebrow {

    display: inline-block;

    margin-bottom: 15px;

    color: var(--cyan);

    font-size: 12px;

    font-weight: 800;

    letter-spacing: 4px;

    text-transform: uppercase;

    text-shadow:
        0 0 12px
        rgba(0,229,212,0.55);

}


h1 {

    margin: 0;

    color: var(--white);

    font-size:
        clamp(38px, 6vw, 64px);

    line-height: 1.02;

    font-weight: 900;

    letter-spacing: -2px;

}


h1 span {

    color: var(--cyan);

    text-shadow:

        0 0 10px
        rgba(0,229,212,0.55),

        0 0 30px
        rgba(0,229,212,0.18);

}


.subtitle {

    max-width: 650px;

    margin:
        20px auto 0;

    color: var(--muted);

    font-size: 16px;

    line-height: 1.7;

}


.back-link {

    display: inline-block;

    margin-top: 16px;

    color: var(--cyan);

    font-size: 14px;

    font-weight: 700;

    text-decoration: none;

    transition:
        0.2s ease;

}


.back-link:hover {

    color: white;

    text-shadow:
        0 0 10px
        rgba(0,229,212,0.6);

}


/* =========================================================
   GALLERY GRID
   ========================================================= */

#gallery {

    display: grid;

    grid-template-columns:
        repeat(4, minmax(0, 1fr));

    gap: 20px;

    margin-top: 30px;

}


/* =========================================================
   DESIGN CARD
   ========================================================= */

.design-btn {

    position: relative;

    overflow: hidden;

    background:

        linear-gradient(
            145deg,
            #111722,
            #080b11
        );

    border:
        1px solid var(--border);

    border-radius: 16px;

    padding: 9px;

    cursor: pointer;

    text-align: left;

    transition:

        transform 0.3s ease,

        border-color 0.3s ease,

        box-shadow 0.3s ease;

    box-shadow:

        0 12px 35px
        rgba(0,0,0,0.35);

}


.design-btn::before {

    content: "";

    position: absolute;

    inset: 0;

    pointer-events: none;

    background:

        linear-gradient(
            135deg,
            rgba(0,229,212,0.07),
            transparent 40%,
            rgba(255,46,159,0.06)
        );

    opacity: 0.8;

}


.design-btn:hover {

    transform:
        translateY(-7px);

    border-color:
        rgba(0,229,212,0.55);

    box-shadow:

        0 0 0 1px
        rgba(0,229,212,0.08),

        0 0 25px
        rgba(0,229,212,0.14),

        0 20px 45px
        rgba(0,0,0,0.55);

}


/* =========================================================
   DESIGN IMAGE
   ========================================================= */

.design-btn img {

    position: relative;

    z-index: 1;

    width: 100%;

    height: 250px;

    object-fit: contain;

    display: block;

    border-radius: 10px;

    padding: 10px;

    background:

        radial-gradient(
            circle at center,
            #171c29 0%,
            #080a0f 75%
        );

    cursor: zoom-in;

    transition:

        transform 0.35s ease,

        filter 0.35s ease;

}


.design-btn:hover img {

    transform:
        scale(1.035);

    filter:

        brightness(1.08)

        saturate(1.08);

}


/* =========================================================
   DESIGN INFORMATION
   ========================================================= */

.design-info {

    position: relative;

    z-index: 2;

    padding:
        15px 5px 7px;

}


.design-btn .name {

    color: var(--white);

    font-size: 15px;

    font-weight: 800;

    line-height: 1.3;

}


.design-btn .price {

    display: inline-block;

    margin-top: 9px;

    padding:
        5px 10px;

    border-radius: 6px;

    color: var(--cyan);

    background:
        rgba(0,229,212,0.07);

    border:
        1px solid
        rgba(0,229,212,0.18);

    font-size: 13px;

    font-weight: 800;

    text-shadow:

        0 0 8px
        rgba(0,229,212,0.35);

}


/* =========================================================
   SELECTED CARD
   ========================================================= */

.design-btn.selected {

    border-color:
        var(--cyan);

    box-shadow:

        0 0 0 1px
        rgba(0,229,212,0.18),

        0 0 30px
        rgba(0,229,212,0.15),

        0 18px 45px
        rgba(0,0,0,0.55);

}


.design-btn.selected::after {

    content:
        "✓ SELECTED";

    position: absolute;

    top: 18px;

    left: 18px;

    z-index: 10;

    padding:
        6px 9px;

    border-radius: 5px;

    background:
        var(--cyan);

    color:
        #06100f;

    font-size: 10px;

    font-weight: 900;

    letter-spacing:
        0.8px;

    box-shadow:

        0 0 15px
        rgba(0,229,212,0.35);

}


/* =========================================================
   SELECTED DESIGN BAR
   ========================================================= */

#selectedBox {

    display: none;

    position: sticky;

    bottom: 20px;

    z-index: 100;

    margin-top: 40px;

    padding:
        18px 22px;

    border-radius: 14px;

    background:
        rgba(9,12,18,0.94);

    border:
        1px solid
        rgba(0,229,212,0.30);

    box-shadow:

        0 0 30px
        rgba(0,229,212,0.08),

        0 20px 50px
        rgba(0,0,0,0.55);

    backdrop-filter:
        blur(14px);

}


#selectedBox.show {

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 20px;

}


.selected-details {

    color:
        var(--muted);

    font-size: 14px;

}


.selected-details strong {

    color:
        var(--white);

}


.selected-details span {

    color:
        var(--cyan);

    font-weight:
        800;

}


/* =========================================================
   CONTINUE BUTTON
   ========================================================= */

#continueBtn {

    padding:
        12px 22px;

    border: none;

    border-radius: 8px;

    background:

        linear-gradient(
            135deg,
            var(--red),
            var(--pink)
        );

    color: white;

    font-size: 13px;

    font-weight: 800;

    cursor: pointer;

    box-shadow:

        0 7px 20px
        rgba(255,43,78,0.20);

    transition:

        transform 0.2s ease,

        filter 0.2s ease,

        box-shadow 0.2s ease;

    white-space:
        nowrap;

}


#continueBtn:hover {

    transform:
        translateY(-2px);

    filter:
        brightness(1.1);

    box-shadow:

        0 0 22px
        rgba(255,46,159,0.35),

        0 10px 28px
        rgba(255,43,78,0.32);

}


/* =========================================================
   LIGHTBOX
   ========================================================= */

#lightbox {

    display: none;

    position: fixed;

    inset: 0;

    z-index: 1000;

    align-items: center;

    justify-content: center;

    padding: 25px;

    background:
        rgba(2,3,7,0.95);

}


#lightbox.show {

    display: flex;

}


#lightbox img {

    max-width:
        94vw;

    max-height:
        88vh;

    object-fit:
        contain;

    border-radius:
        10px;

    box-shadow:

        0 0 35px
        rgba(0,229,212,0.12),

        0 25px 80px
        rgba(0,0,0,0.75);

}


#lightbox .close-hint {

    position: absolute;

    top: 18px;

    right: 28px;

    color: white;

    font-size: 38px;

    font-weight: 300;

    cursor: pointer;

    opacity: 0.75;

    transition:
        0.2s ease;

}


#lightbox .close-hint:hover {

    opacity: 1;

    color:
        var(--cyan);

    text-shadow:

        0 0 15px
        rgba(0,229,212,0.6);

}


/* =========================================================
   LOADING
   ========================================================= */

.loading {

    grid-column:
        1 / -1;

    padding:
        80px 20px;

    text-align:
        center;

    color:
        var(--muted);

    font-size:
        15px;

}


/* =========================================================
   ERROR
   ========================================================= */

.error {

    grid-column:
        1 / -1;

    padding:
        60px 20px;

    text-align:
        center;

    color:
        #ff8a96;

}


/* =========================================================
   BIKE DECAL SPECIAL THEME
   ========================================================= */

body.bike-category .eyebrow {

    color:
        var(--pink);

    text-shadow:

        0 0 12px
        rgba(255,46,159,0.55);

}


body.bike-category h1 span {

    color:
        var(--pink);

    text-shadow:

        0 0 10px
        rgba(255,46,159,0.55),

        0 0 30px
        rgba(255,46,159,0.20);

}


body.bike-category .design-btn:hover {

    border-color:
        rgba(255,46,159,0.55);

    box-shadow:

        0 0 0 1px
        rgba(255,46,159,0.08),

        0 0 28px
        rgba(255,46,159,0.16),

        0 20px 45px
        rgba(0,0,0,0.55);

}


body.bike-category .design-btn .price {

    color:
        var(--pink);

    background:
        rgba(255,46,159,0.07);

    border-color:
        rgba(255,46,159,0.20);

    text-shadow:

        0 0 8px
        rgba(255,46,159,0.35);

}


/* =========================================================
   TABLET
   ========================================================= */

@media (max-width: 950px) {

    #gallery {

        grid-template-columns:
            repeat(3, minmax(0, 1fr));

    }

}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 700px) {

    .page {

        width:
            94%;

        padding:
            45px 0 80px;

    }


    #gallery {

        grid-template-columns:
            repeat(2, minmax(0, 1fr));

        gap: 14px;

    }


    h1 {

        font-size:
            40px;

    }


    .subtitle {

        font-size:
            14px;

    }


    .design-btn img {

        height:
            190px;

        padding:
            7px;

    }


    #selectedBox.show {

        flex-direction:
            column;

        align-items:
            stretch;

    }


    #continueBtn {

        width:
            100%;

    }

}


/* =========================================================
   SMALL MOBILE
   ========================================================= */

@media (max-width: 430px) {

    #gallery {

        grid-template-columns:
            1fr;

    }


    .design-btn img {

        height:
            230px;

    }


    h1 {

        font-size:
            36px;

    }

}


/* =========================================================
   REDUCE MOTION
   ========================================================= */

@media (prefers-reduced-motion: reduce) {

    * {

        scroll-behavior:
            auto !important;

        transition:
            none !important;

    }

}

</style>

</head>


<body>


<div class="page">


    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header class="header">

        <div class="eyebrow">
            STICKING COLLECTION
        </div>


        <h1 id="pageTitle">

            Choose Your
            <span>Design.</span>

        </h1>


        <p
            class="subtitle"
            id="pageSub"
        >

            Select a design to see how it
            looks before moving forward.

        </p>

    </header>



    <!-- =====================================================
         GALLERY
         ===================================================== -->

    <div id="gallery">

        <div class="loading">

            Loading designs...

        </div>

    </div>



    <!-- =====================================================
         SELECTED DESIGN
         ===================================================== -->

    <div id="selectedBox">

        <div class="selected-details">

            <strong>
                Selected:
            </strong>

            <span id="selectedName">
            </span>

            &nbsp; · &nbsp;

            <span id="selectedPrice">
            </span>

        </div>


        <button id="continueBtn">

            Continue →

        </button>

    </div>


</div>



<!-- =====================================================
     LIGHTBOX
     ===================================================== -->

<div id="lightbox">

    <span class="close-hint">
        &times;
    </span>


    <img
        id="lightboxImg"
        src=""
        alt="Design preview"
    >

</div>



<script>


/* =========================================================
   SELECTED DESIGN
   ========================================================= */

let selectedDesign = null;



/* =========================================================
   LIGHTBOX
   ========================================================= */

function openLightbox(imageUrl, altText) {

    const lightboxImg =
        document.getElementById(
            "lightboxImg"
        );


    lightboxImg.src =
        imageUrl;


    lightboxImg.alt =
        altText;


    document
        .getElementById("lightbox")
        .classList.add("show");

}


function closeLightbox() {

    document
        .getElementById("lightbox")
        .classList.remove("show");

}


document
    .getElementById("lightbox")
    .addEventListener(
        "click",
        closeLightbox
    );



/* =========================================================
   CATEGORY TITLES
   ========================================================= */

const categoryTitles = {

    "car-skin":
        "Car Skin <span>Collection.</span>",

    "windshield-window":
        "Windshield & Window <span>Collection.</span>",

    "body-sticker":
        "Body Sticker <span>Collection.</span>",

    "bike-decal":
        "Bike Decal <span>Collection.</span>"

};



/* =========================================================
   GET CATEGORY FROM URL
   ========================================================= */

const params =
    new URLSearchParams(
        window.location.search
    );


const selectedCategory =
    params.get("category");



/* =========================================================
   UPDATE PAGE TITLE
   ========================================================= */

if (
    selectedCategory &&
    categoryTitles[selectedCategory]
) {

    document
        .getElementById("pageTitle")
        .innerHTML =
            categoryTitles[
                selectedCategory
            ];


    document
        .getElementById("pageSub")
        .innerHTML =

        'Choose a design below. <a class="back-link" href="/gallery.html">View all designs →</a>';

}



/* =========================================================
   BIKE CATEGORY THEME
   ========================================================= */

if (
    selectedCategory ===
    "bike-decal"
) {

    document.body
        .classList
        .add("bike-category");

}



/* =========================================================
   LOAD DESIGNS
   ========================================================= */

fetch("/designs.json")

    .then((res) => {

        if (!res.ok) {

            throw new Error(
                "Unable to load designs"
            );

        }


        return res.json();

    })


    .then((designs) => {


        const gallery =
            document.getElementById(
                "gallery"
            );


        gallery.innerHTML = "";



        /* =================================================
           FILTER CATEGORY
           ================================================= */

        const filtered =

            selectedCategory

                ? designs.filter(
                    (design) =>
                        design.category ===
                        selectedCategory
                )

                : designs;



        /* =================================================
           NO DESIGNS
           ================================================= */

        if (
            !filtered.length
        ) {

            gallery.innerHTML =

                '<div class="error">No designs found in this collection yet.</div>';

            return;

        }



        /* =================================================
           CREATE DESIGN CARDS
           ================================================= */

        filtered.forEach(
            (design) => {


                const btn =
                    document.createElement(
                        "div"
                    );


                btn.className =
                    "design-btn";


                btn.dataset.id =
                    design.id;



                btn.innerHTML = `

                    <img
                        src="${design.imageUrl}"
                        alt="${design.name}"
                        loading="lazy"
                    >

                    <div class="design-info">

                        <div class="name">

                            ${design.name}

                        </div>


                        <div class="price">

                            ${design.price}

                        </div>

                    </div>

                `;



                /* =========================================
                   SELECT DESIGN
                   ========================================= */

                btn.addEventListener(
                    "click",
                    () => {

                        selectDesign(
                            design,
                            btn
                        );

                    }
                );



                gallery.appendChild(
                    btn
                );



                /* =========================================
                   IMAGE LIGHTBOX
                   ========================================= */

                const img =
                    btn.querySelector(
                        "img"
                    );


                img.addEventListener(
                    "click",
                    (e) => {

                        e.stopPropagation();


                        openLightbox(
                            design.imageUrl,
                            design.name
                        );

                    }
                );

            }

        );

    })


    /* =====================================================
       ERROR HANDLING
       ===================================================== */

    .catch((error) => {

        console.error(error);


        document
            .getElementById("gallery")
            .innerHTML =

            '<div class="error">Couldn’t load the designs. Please try again.</div>';

    });



/* =========================================================
   SELECT DESIGN FUNCTION
   ========================================================= */

function selectDesign(
    design,
    btnEl
) {


    selectedDesign =
        design;



    /* Remove previous selection */

    document
        .querySelectorAll(
            ".design-btn"
        )
        .forEach(
            (button) => {

                button.classList.remove(
                    "selected"
                );

            }
        );



    /* Add selection */

    btnEl.classList.add(
        "selected"
    );



    /* Show name */

    document
        .getElementById(
            "selectedName"
        )
        .textContent =
            design.name;



    /* Show price */

    document
        .getElementById(
            "selectedPrice"
        )
        .textContent =
            design.price;



    /* Show selected box */

    document
        .getElementById(
            "selectedBox"
        )
        .classList.add(
            "show"
        );

}



/* =========================================================
   CONTINUE BUTTON
   ========================================================= */

document
    .getElementById(
        "continueBtn"
    )
    .addEventListener(
        "click",
        () => {


            if (
                !selectedDesign
            ) {

                return;

            }



            /* Save selected design */

            localStorage.setItem(
                "chosenDesign",
                JSON.stringify(
                    selectedDesign
                )
            );



            /*

            IMPORTANT:

            For now this shows a confirmation.

            When your vehicle upload/customization
            page is ready, replace the alert with:

            window.location.href =
                "/upload.html";

            */


            alert(
                "Design saved: " +
                selectedDesign.name
            );

        }
    );


</script>


</body>

</html>
