<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Choose Your Design</title>
<style>
  :root {
    --bg: #0a0a12;
    --bg-panel: #14141f;
    --cyan: #00fff2;
    --magenta: #ff2ee6;
    --red: #ff2b4e;
    --text: #f2f2fb;
    --text-dim: #b8b8cc;
    --border: rgba(0, 255, 242, 0.3);
  }
  body { font-family: Arial, sans-serif; max-width: 640px; margin: 30px auto; padding: 0 16px; background: var(--bg); color: var(--text); }
  h2 { margin-bottom: 4px; color: #ffffff; text-shadow: 0 0 6px var(--cyan), 0 0 18px rgba(0, 255, 242, 0.4); }
  p.sub { color: var(--text-dim); margin-top: 0; }
  p.sub a { color: var(--cyan); }
  p.sub a:hover { color: var(--magenta); }

  #gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 14px;
    margin-top: 20px;
  }

  .design-btn {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px;
    background: var(--bg-panel);
    cursor: pointer;
    text-align: center;
    transition: border-color 0.15s, box-shadow 0.2s, transform 0.1s;
    box-shadow: 0 0 8px rgba(0, 255, 242, 0.08);
  }
  .design-btn:hover { transform: translateY(-2px); box-shadow: 0 0 16px rgba(0, 255, 242, 0.3); }
  .design-btn.selected {
    border-color: var(--cyan);
    box-shadow: 0 0 18px rgba(0, 255, 242, 0.55), 0 0 30px rgba(255, 46, 230, 0.25);
  }

  .design-btn img {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    border-radius: 6px;
    background: #1b1b26;
    cursor: zoom-in;
  }
  .design-btn .name { font-weight: bold; margin-top: 8px; font-size: 14px; color: var(--text); }
  .design-btn .price { color: var(--cyan); font-size: 13px; margin-top: 2px; text-shadow: 0 0 6px rgba(0,255,242,0.4); }

  /* Full-size image preview (lightbox) */
  #lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(5,5,10,0.92);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 20px;
    box-sizing: border-box;
  }
  #lightbox.show { display: flex; }
  #lightbox img {
    max-width: 100%;
    max-height: 90vh;
    border-radius: 8px;
    box-shadow: 0 0 30px rgba(0, 255, 242, 0.3);
  }
  #lightbox .close-hint {
    position: absolute;
    top: 16px;
    right: 20px;
    color: var(--cyan);
    font-size: 28px;
    cursor: pointer;
    line-height: 1;
    text-shadow: 0 0 8px var(--cyan);
  }

  #selectedBox {
    margin-top: 24px;
    padding: 14px;
    border-radius: 8px;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    color: var(--text);
    display: none;
  }
  #selectedBox.show { display: block; }
  #continueBtn {
    margin-top: 12px;
    padding: 10px 18px;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 15px;
    background: linear-gradient(135deg, var(--red), var(--magenta));
    box-shadow: 0 0 10px rgba(255, 43, 78, 0.5), 0 0 22px rgba(255, 46, 230, 0.3);
    text-shadow: 0 0 6px rgba(255,255,255,0.4);
  }
  #continueBtn:hover {
    box-shadow: 0 0 16px rgba(255, 43, 78, 0.8), 0 0 34px rgba(255, 46, 230, 0.5);
  }
</style>
</head>
<body>
  <h2 id="pageTitle">Choose Your Design</h2>
  <p class="sub" id="pageSub">Tap a design to select it.</p>

  <div id="gallery">Loading designs...</div>

  <div id="selectedBox">
    <strong>Selected:</strong> <span id="selectedName"></span> — <span id="selectedPrice"></span>
    <br />
    <button id="continueBtn">Continue with this design</button>
  </div>

  <!-- Full-size image preview, hidden until an image is clicked -->
  <div id="lightbox">
    <span class="close-hint">&times;</span>
    <img id="lightboxImg" src="" alt="Full size preview" />
  </div>

  <script>
    let selectedDesign = null;

    // Opens the full-size preview when a photo is clicked
    function openLightbox(imageUrl, altText) {
      const lightboxImg = document.getElementById("lightboxImg");
      lightboxImg.src = imageUrl;
      lightboxImg.alt = altText;
      document.getElementById("lightbox").classList.add("show");
    }

    // Closes it on click anywhere inside the overlay
    document.getElementById("lightbox").addEventListener("click", () => {
      document.getElementById("lightbox").classList.remove("show");
    });

    // Human-friendly titles shown at the top depending on which category was linked
    const categoryTitles = {
      "car-skin": "Car Skin Collection",
      "windshield-window": "Windshield & Window Sticker Collection",
      "body-sticker": "Body Sticker Collection",
    };

    // Read ?category=... from the URL (this is what each "Start" button sends)
    const params = new URLSearchParams(window.location.search);
    const selectedCategory = params.get("category"); // e.g. "car-skin", or null if none given

    if (selectedCategory && categoryTitles[selectedCategory]) {
      document.getElementById("pageTitle").textContent = categoryTitles[selectedCategory];
      document.getElementById("pageSub").innerHTML =
        'Tap a design to select it. <a href="/gallery.html" style="color:#1a73e8;">View all designs</a>';
    }

    // This is the part that makes new designs "just work":
    // it fetches your designs.json file and builds one button per matching entry.
    fetch("/designs.json")
      .then((res) => res.json())
      .then((designs) => {
        const gallery = document.getElementById("gallery");
        gallery.innerHTML = "";

        // If a category was specified in the link, only show designs matching it.
        // If no category was given, show everything.
        const filtered = selectedCategory
          ? designs.filter((d) => d.category === selectedCategory)
          : designs;

        if (filtered.length === 0) {
          gallery.textContent = "No designs found in this category yet.";
          return;
        }

        filtered.forEach((design) => {
          const btn = document.createElement("div");
          btn.className = "design-btn";
          btn.dataset.id = design.id;
          btn.innerHTML = `
            <img src="${design.imageUrl}" alt="${design.name}" onerror="this.style.background='#eee'; this.src='';" />
            <div class="name">${design.name}</div>
            <div class="price">${design.price}</div>
          `;

          // This is the "buttons respond" part — clicking the card selects it
          btn.addEventListener("click", () => selectDesign(design, btn));

          gallery.appendChild(btn);
        });

        // Clicking directly on a photo opens the full-size preview instead of just selecting.
        // stopPropagation prevents this click from also triggering the card's select click above.
        gallery.querySelectorAll(".design-btn img").forEach((imgEl, i) => {
          imgEl.addEventListener("click", (e) => {
            e.stopPropagation();
            openLightbox(filtered[i].imageUrl, filtered[i].name);
          });
        });
      })
      .catch(() => {
        document.getElementById("gallery").textContent =
          "Couldn't load designs. Make sure designs.json is in the /public folder.";
      });

    function selectDesign(design, btnEl) {
      selectedDesign = design;

      // Highlight only the clicked button
      document.querySelectorAll(".design-btn").forEach((b) => b.classList.remove("selected"));
      btnEl.classList.add("selected");

      // Show the selection summary
      document.getElementById("selectedName").textContent = design.name;
      document.getElementById("selectedPrice").textContent = design.price;
      document.getElementById("selectedBox").classList.add("show");
    }

    document.getElementById("continueBtn").addEventListener("click", () => {
      if (!selectedDesign) return;
      // Save the choice so the next page (e.g. your photo-upload tool) can read it
      localStorage.setItem("chosenDesign", JSON.stringify(selectedDesign));
      alert("Design saved: " + selectedDesign.name + "\n(This is where we'd move to the photo upload step.)");
      // Later: window.location.href = "/index.html";
    });
  </script>
</body>
</html>
