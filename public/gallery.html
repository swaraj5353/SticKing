<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SticKing — Choose Your Design</title>

<style>

:root {
    --bg: #080a0f;
    --panel: #10141b;
    --panel-hover: #141a22;

    --cyan: #00e5d4;
    --cyan-soft: rgba(0,229,212,0.12);

    --pink: #ff2e9f;
    --red: #ff3b4d;

    --white: #f5f7fa;
    --muted: #9aa4b2;

    --border: rgba(255,255,255,0.10);
    --border-hover: rgba(0,229,212,0.45);
}


/* =====================================================
   GLOBAL
   ===================================================== */

* {
    box-sizing: border-box;
}

html {
    background: var(--bg);
}

body {
    margin: 0;
    padding: 0;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        radial-gradient(
            circle at 50% -10%,
            rgba(0,229,212,0.07),
            transparent 45%
        ),
        var(--bg);

    color: var(--white);
}


/* =====================================================
   MAIN CONTAINER
   ===================================================== */

.page {
    width: min(1180px, 92%);
    margin: 0 auto;
    padding: 65px 0 80px;
}


/* =====================================================
   HEADER
   ===================================================== */

.header {
    text-align: center;
    margin-bottom: 45px;
}

.eyebrow {
    display: inline-block;

    margin-bottom: 14px;

    color: var(--cyan);

    font-size: 12px;
    font-weight: 700;

    letter-spacing: 3px;
    text-transform: uppercase;
}

h1 {
    margin: 0;

    color: var(--white);

    font-size: clamp(36px, 5vw, 58px);

    line-height: 1.05;

    font-weight: 800;

    letter-spacing: -1.5px;
}

h1 span {
    color: var(--cyan);
}

.subtitle {
    max-width: 620px;

    margin: 18px auto 0;

    color: var(--muted);

    font-size: 16px;

    line-height: 1.7;
}

.back-link {
    display: inline-block;

    margin-top: 18px;

    color: var(--cyan);

    font-size: 14px;
    font-weight: 600;

    text-decoration: none;

    transition: color 0.2s ease;
}

.back-link:hover {
    color: white;
}


/* =====================================================
   GALLERY
   ===================================================== */

#gallery {

    display: grid;

    grid-template-columns:
        repeat(4, minmax(0, 1fr));

    gap: 20px;

    margin-top: 30px;
}


/* =====================================================
   DESIGN CARD
   ===================================================== */

.design-btn {

    position: relative;

    overflow: hidden;

    background:
        linear-gradient(
            145deg,
            #11161e,
            #0c1016
        );

    border:
        1px solid var(--border);

    border-radius: 12px;

    padding: 10px;

    cursor: pointer;

    text-align: left;

    transition:
        transform 0.25s ease,
        border-color 0.25s ease,
        box-shadow 0.25s ease;
}

.design-btn:hover {

    transform: translateY(-5px);

    border-color:
        var(--border-hover);

    box-shadow:
        0 15px 35px rgba(0,0,0,0.40);
}


/* =====================================================
   IMAGE
   ===================================================== */

.design-btn img {

    width: 100%;

    aspect-ratio: 1 / 1;

    object-fit: cover;

    display: block;

    border-radius: 8px;

    background: #080a0f;

    cursor: zoom-in;

    transition:
        transform 0.35s ease,
        filter 0.35s ease;
}

.design-btn:hover img {

    transform: scale(1.025);

    filter:
        brightness(1.05);
}


/* =====================================================
   DESIGN INFORMATION
   ===================================================== */

.design-info {
    padding: 14px 4px 6px;
}

.design-btn .name {

    color: var(--white);

    font-size: 15px;

    font-weight: 700;

    line-height: 1.3;
}

.design-btn .price {

    margin-top: 6px;

    color: var(--cyan);

    font-size: 13px;

    font-weight: 600;
}


/* =====================================================
   SELECTED CARD
   ===================================================== */

.design-btn.selected {

    border-color:
        var(--cyan);

    box-shadow:
        0 0 0 1px rgba(0,229,212,0.18),
        0 15px 40px rgba(0,229,212,0.08);
}

.design-btn.selected::after {

    content: "✓ SELECTED";

    position: absolute;

    top: 18px;
    left: 18px;

    padding: 6px 9px;

    border-radius: 5px;

    background: var(--cyan);

    color: #07100f;

    font-size: 10px;

    font-weight: 800;

    letter-spacing: 0.8px;
}


/* =====================================================
   SELECTED DESIGN BOX
   ===================================================== */

#selectedBox {

    display: none;

    position: sticky;

    bottom: 20px;

    z-index: 20;

    margin-top: 35px;

    padding: 20px 22px;

    border-radius: 12px;

    background:
        rgba(16,20,27,0.96);

    border:
        1px solid rgba(0,229,212,0.30);

    box-shadow:
        0 15px 40px rgba(0,0,0,0.45);

    backdrop-filter: blur(12px);
}

#selectedBox.show {
    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 20px;
}

.selected-details {
    color: var(--muted);

    font-size: 14px;
}

.selected-details strong {
    color: var(--white);
}

.selected-details span {
    color: var(--cyan);

    font-weight: 700;
}


/* =====================================================
   CONTINUE BUTTON
   ===================================================== */

#continueBtn {

    padding: 12px 20px;

    border: none;

    border-radius: 7px;

    background:
        linear-gradient(
            135deg,
            var(--red),
            var(--pink)
        );

    color: white;

    font-size: 13px;

    font-weight: 700;

    cursor: pointer;

    box-shadow:
        0 7px 20px rgba(255,43,78,0.20);

    transition:
        transform 0.2s ease,
        filter 0.2s ease,
        box-shadow 0.2s ease;

    white-space: nowrap;
}

#continueBtn:hover {

    transform: translateY(-2px);

    filter: brightness(1.08);

    box-shadow:
        0 10px 28px rgba(255,43,78,0.32);
}


/* =====================================================
   LIGHTBOX
   ===================================================== */

#lightbox {

    display: none;

    position: fixed;

    inset: 0;

    z-index: 1000;

    align-items: center;
    justify-content: center;

    padding: 25px;

    background:
        rgba(3,5,8,0.94);
}

#lightbox.show {
    display: flex;
}

#lightbox img {

    max-width: 92vw;

    max-height: 88vh;

    object-fit: contain;

    border-radius: 8px;

    box-shadow:
        0 25px 80px rgba(0,0,0,0.65);
}

#lightbox .close-hint {

    position: absolute;

    top: 20px;
    right: 28px;

    color: white;

    font-size: 32px;

    font-weight: 300;

    cursor: pointer;

    opacity: 0.75;

    transition: opacity 0.2s ease;
}

#lightbox .close-hint:hover {
    opacity: 1;
}


/* =====================================================
   LOADING / ERROR
   ===================================================== */

.loading {

    grid-column: 1 / -1;

    padding: 70px 20px;

    text-align: center;

    color: var(--muted);

    font-size: 15px;
}

.error {

    grid-column: 1 / -1;

    padding: 50px 20px;

    text-align: center;

    color: #ff8a96;
}


/* =====================================================
   MOBILE
   ===================================================== */

@media (max-width: 950px) {

    #gallery {
        grid-template-columns:
            repeat(3, minmax(0, 1fr));
    }
}

@media (max-width: 700px) {

    .page {
        width: 94%;

        padding-top: 45px;
    }

    #gallery {

        grid-template-columns:
            repeat(2, minmax(0, 1fr));

        gap: 14px;
    }

    h1 {
        font-size: 40px;
    }

    #selectedBox.show {

        flex-direction: column;

        align-items: stretch;
    }

    #continueBtn {
        width: 100%;
    }
}

@media (max-width: 430px) {

    #gallery {
        grid-template-columns: 1fr;
    }

    .design-btn img {
        aspect-ratio: 1.15 / 1;
    }
}

</style>
</head>


<body>

<div class="page">


    <!-- =================================================
         HEADER
         ================================================= -->

    <header class="header">

        <div class="eyebrow">
            STICKING COLLECTION
        </div>

        <h1 id="pageTitle">
            Choose Your <span>Design.</span>
        </h1>

        <p class="subtitle" id="pageSub">
            Select a design to see how it looks before moving forward.
        </p>

    </header>


    <!-- =================================================
         GALLERY
         ================================================= -->

    <div id="gallery">

        <div class="loading">
            Loading designs...
        </div>

    </div>


    <!-- =================================================
         SELECTED DESIGN
         ================================================= -->

    <div id="selectedBox">

        <div class="selected-details">

            <strong>Selected:</strong>

            <span id="selectedName"></span>

            &nbsp; · &nbsp;

            <span id="selectedPrice"></span>

        </div>

        <button id="continueBtn">
            Continue →
        </button>

    </div>


</div>


<!-- =====================================================
     LIGHTBOX
     ===================================================== -->

<div id="lightbox">

    <span class="close-hint">&times;</span>

    <img
        id="lightboxImg"
        src=""
        alt="Design preview"
    >

</div>


<script>

let selectedDesign = null;


/* =====================================================
   LIGHTBOX
   ===================================================== */

function openLightbox(imageUrl, altText) {

    const lightboxImg =
        document.getElementById("lightboxImg");

    lightboxImg.src = imageUrl;

    lightboxImg.alt = altText;

    document
        .getElementById("lightbox")
        .classList.add("show");
}


function closeLightbox() {

    document
        .getElementById("lightbox")
        .classList.remove("show");
}


document
    .getElementById("lightbox")
    .addEventListener(
        "click",
        closeLightbox
    );


/* =====================================================
   CATEGORY
   ===================================================== */

const categoryTitles = {

    "car-skin":
        "Car Skin <span>Collection.</span>",

    "windshield-window":
        "Windshield & Window <span>Collection.</span>",

    "body-sticker":
        "Body Sticker <span>Collection.</span>"

};


const params =
    new URLSearchParams(
        window.location.search
    );

const selectedCategory =
    params.get("category");


if (
    selectedCategory &&
    categoryTitles[selectedCategory]
) {

    document
        .getElementById("pageTitle")
        .innerHTML =
            categoryTitles[selectedCategory];

    document
        .getElementById("pageSub")
        .innerHTML =
            'Choose a design below. <a class="back-link" href="/gallery.html">View all designs →</a>';
}


/* =====================================================
   LOAD DESIGNS
   ===================================================== */

fetch("/designs.json")

    .then((res) => {

        if (!res.ok) {
            throw new Error(
                "Unable to load designs"
            );
        }

        return res.json();

    })

    .then((designs) => {

        const gallery =
            document.getElementById("gallery");

        gallery.innerHTML = "";


        const filtered =
            selectedCategory

                ? designs.filter(
                    (d) =>
                        d.category ===
                        selectedCategory
                )

                : designs;


        if (!filtered.length) {

            gallery.innerHTML =
                '<div class="error">No designs found in this collection yet.</div>';

            return;
        }


        filtered.forEach(
            (design, index) => {

                const btn =
                    document.createElement(
                        "div"
                    );

                btn.className =
                    "design-btn";

                btn.dataset.id =
                    design.id;


                btn.innerHTML = `

                    <img
                        src="${design.imageUrl}"
                        alt="${design.name}"
                        loading="lazy"
                    >

                    <div class="design-info">

                        <div class="name">
                            ${design.name}
                        </div>

                        <div class="price">
                            ${design.price}
                        </div>

                    </div>

                `;


                /* Select design */

                btn.addEventListener(
                    "click",
                    () =>
                        selectDesign(
                            design,
                            btn
                        )
                );


                gallery.appendChild(btn);


                /* Full-size preview */

                const img =
                    btn.querySelector("img");


                img.addEventListener(
                    "click",
                    (e) => {

                        e.stopPropagation();

                        openLightbox(
                            design.imageUrl,
                            design.name
                        );

                    }
                );

            }
        );

    })

    .catch((error) => {

        console.error(error);

        document
            .getElementById("gallery")
            .innerHTML =
                '<div class="error">Couldn’t load the designs. Please try again.</div>';

    });


/* =====================================================
   SELECT DESIGN
   ===================================================== */

function selectDesign(
    design,
    btnEl
) {

    selectedDesign =
        design;


    document
        .querySelectorAll(".design-btn")
        .forEach(
            (b) =>
                b.classList.remove(
                    "selected"
                )
        );


    btnEl.classList.add(
        "selected"
    );


    document
        .getElementById(
            "selectedName"
        )
        .textContent =
            design.name;


    document
        .getElementById(
            "selectedPrice"
        )
        .textContent =
            design.price;


    document
        .getElementById(
            "selectedBox"
        )
        .classList.add(
            "show"
        );

}


/* =====================================================
   CONTINUE
   ===================================================== */

document
    .getElementById(
        "continueBtn"
    )
    .addEventListener(
        "click",
        () => {

            if (!selectedDesign)
                return;


            localStorage.setItem(
                "chosenDesign",
                JSON.stringify(
                    selectedDesign
                )
            );


            alert(
                "Design saved: " +
                selectedDesign.name
            );


            /*
             * LATER:
             *
             * Replace the alert above with:
             *
             * window.location.href =
             * "/upload.html";
             *
             * when your vehicle-photo
             * customization tool is ready.
             */

        }
    );

</script>

</body>
</html>
