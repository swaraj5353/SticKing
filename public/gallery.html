<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SticKing — Design Collection</title>

    <style>

        /* =========================================================
           STICKING AUTOMOTIVE NEON THEME
           ========================================================= */

        :root {
            --bg: #050509;
            --bg2: #080a10;

            --card: #0d1018;
            --card2: #111522;

            --white: #f5f7fb;
            --muted: #9ba3b2;

            --pink: #ff2ea6;
            --pink2: #ff4fc3;

            --purple: #8b5cf6;
            --cyan: #00e5d4;
            --cyan2: #00fff0;

            --border: rgba(255,255,255,0.08);
        }


        /* =========================================================
           GLOBAL
           ========================================================= */

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            background: var(--bg);
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: var(--white);

            background:
                radial-gradient(
                    circle at 10% 0%,
                    rgba(255,46,166,0.13),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 90% 0%,
                    rgba(0,229,212,0.12),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 50% 100%,
                    rgba(139,92,246,0.10),
                    transparent 38%
                ),

                linear-gradient(
                    180deg,
                    #050509 0%,
                    #080a10 50%,
                    #040509 100%
                );
        }


        body::before {
            content: "";

            position: fixed;
            inset: 0;

            pointer-events: none;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,46,166,0.025),
                    transparent
                );

            z-index: -1;
        }


        /* =========================================================
           PAGE
           ========================================================= */

        .page {
            width: min(1280px, 92%);
            margin: 0 auto;

            padding:
                55px 0 100px;
        }


        /* =========================================================
           TOP NAV
           ========================================================= */

        .topbar {
            display: flex;

            align-items: center;
            justify-content: space-between;

            margin-bottom: 55px;
        }

        .brand {
            color: white;

            font-size: 19px;
            font-weight: 900;

            letter-spacing: 2px;

            text-decoration: none;

            text-transform: uppercase;
        }

        .brand span {
            color: var(--pink);

            text-shadow:
                0 0 12px rgba(255,46,166,0.55);
        }

        .home-link {
            display: inline-flex;

            align-items: center;

            padding:
                9px 15px;

            border:
                1px solid rgba(255,255,255,0.09);

            border-radius: 999px;

            color: var(--muted);

            background:
                rgba(255,255,255,0.035);

            text-decoration: none;

            font-size: 13px;
            font-weight: 700;

            transition:
                0.25s ease;
        }

        .home-link:hover {
            color: white;

            border-color:
                rgba(0,229,212,0.45);

            box-shadow:
                0 0 20px
                rgba(0,229,212,0.10);
        }


        /* =========================================================
           HEADER
           ========================================================= */

        .header {
            text-align: center;

            margin-bottom: 50px;
        }

        .eyebrow {
            display: inline-block;

            margin-bottom: 14px;

            color: var(--cyan);

            font-size: 11px;
            font-weight: 900;

            letter-spacing: 5px;

            text-transform: uppercase;

            text-shadow:
                0 0 12px
                rgba(0,229,212,0.55);
        }

        h1 {
            margin: 0;

            font-size:
                clamp(38px, 6vw, 70px);

            line-height: 1;

            font-weight: 950;

            letter-spacing: -3px;
        }

        h1 span {
            background:
                linear-gradient(
                    90deg,
                    var(--pink),
                    var(--purple),
                    var(--cyan)
                );

            -webkit-background-clip: text;
            background-clip: text;

            -webkit-text-fill-color: transparent;

            text-shadow: none;
        }

        .subtitle {
            max-width: 690px;

            margin:
                20px auto 0;

            color: var(--muted);

            font-size: 15px;

            line-height: 1.7;
        }

        .back-link {
            color: var(--cyan);

            font-weight: 800;

            text-decoration: none;
        }

        .back-link:hover {
            color: white;
        }


        /* =========================================================
           COLLECTION LINE
           ========================================================= */

        .collection-line {
            display: flex;

            align-items: center;

            gap: 14px;

            margin:
                0 0 28px;
        }

        .collection-line::before,
        .collection-line::after {
            content: "";

            height: 1px;

            flex: 1;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,46,166,0.35),
                    rgba(0,229,212,0.25)
                );
        }

        .collection-line span {
            color: #687080;

            font-size: 10px;

            letter-spacing: 3px;

            font-weight: 800;

            text-transform: uppercase;
        }


        /* =========================================================
           GALLERY
           ========================================================= */

        #gallery {
            display: grid;

            grid-template-columns:
                repeat(4, minmax(0, 1fr));

            gap: 22px;

            margin-top: 30px;
        }


        /* =========================================================
           DESIGN CARD
           ========================================================= */

        .design-btn {
            position: relative;

            overflow: hidden;

            padding: 8px;

            border:
                1px solid
                rgba(255,255,255,0.075);

            border-radius: 18px;

            background:
                linear-gradient(
                    145deg,
                    rgba(18,22,32,0.96),
                    rgba(7,9,14,0.98)
                );

            cursor: pointer;

            text-align: left;

            transition:
                transform 0.3s ease,
                border-color 0.3s ease,
                box-shadow 0.3s ease;
        }


        /* Gradient border effect */

        .design-btn::before {
            content: "";

            position: absolute;

            inset: 0;

            border-radius: 18px;

            padding: 1px;

            background:
                linear-gradient(
                    135deg,
                    rgba(255,46,166,0.7),
                    rgba(139,92,246,0.35),
                    rgba(0,229,212,0.65)
                );

            -webkit-mask:
                linear-gradient(#fff 0 0) content-box,
                linear-gradient(#fff 0 0);

            -webkit-mask-composite: xor;

            mask-composite: exclude;

            opacity: 0;

            transition:
                opacity 0.3s ease;

            pointer-events: none;
        }


        .design-btn:hover {
            transform:
                translateY(-8px);

            border-color:
                rgba(255,255,255,0.15);

            box-shadow:
                0 20px 55px
                rgba(0,0,0,0.60),

                0 0 30px
                rgba(255,46,166,0.12),

                0 0 25px
                rgba(0,229,212,0.07);
        }

        .design-btn:hover::before {
            opacity: 1;
        }


        /* =========================================================
           IMAGE
           ========================================================= */

        .design-btn img {
            position: relative;

            z-index: 1;

            display: block;

            width: 100%;

            height: 250px;

            object-fit: contain;

            padding: 8px;

            border-radius: 12px;

            background:
                radial-gradient(
                    circle at center,
                    #171b28 0%,
                    #090b11 72%,
                    #050609 100%
                );

            cursor: zoom-in;

            transition:
                transform 0.4s ease,
                filter 0.4s ease;
        }


        .design-btn:hover img {
            transform:
                scale(1.045);

            filter:
                brightness(1.08)
                saturate(1.08);
        }


        /* =========================================================
           IMAGE SHINE
           ========================================================= */

        .design-btn .image-shine {
            position: absolute;

            top: 0;
            left: -120%;

            width: 60%;
            height: 100%;

            z-index: 4;

            pointer-events: none;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,0.07),
                    transparent
                );

            transform:
                skewX(-20deg);

            transition:
                left 0.7s ease;
        }

        .design-btn:hover .image-shine {
            left: 150%;
        }


        /* =========================================================
           DESIGN INFO
           ========================================================= */

        .design-info {
            position: relative;

            z-index: 5;

            padding:
                16px 7px 8px;
        }

        .design-btn .name {
            color: white;

            font-size: 15px;

            font-weight: 850;

            line-height: 1.3;
        }

        .design-btn .price {
            display: inline-block;

            margin-top: 10px;

            padding:
                6px 11px;

            border:
                1px solid
                rgba(255,46,166,0.30);

            border-radius: 7px;

            color: #ff62bd;

            background:
                rgba(255,46,166,0.07);

            font-size: 12px;

            font-weight: 900;

            text-shadow:
                0 0 9px
                rgba(255,46,166,0.35);

            box-shadow:
                0 0 15px
                rgba(255,46,166,0.04);
        }


        /* =========================================================
           SELECTED DESIGN
           ========================================================= */

        .design-btn.selected {
            border-color:
                var(--pink);

            box-shadow:
                0 0 0 1px
                rgba(255,46,166,0.15),

                0 0 30px
                rgba(255,46,166,0.17),

                0 20px 55px
                rgba(0,0,0,0.55);
        }

        .design-btn.selected::before {
            opacity: 1;
        }

        .design-btn.selected::after {
            content:
                "✓ SELECTED";

            position: absolute;

            top: 17px;
            left: 17px;

            z-index: 20;

            padding:
                6px 9px;

            border-radius: 6px;

            color: white;

            background:
                linear-gradient(
                    90deg,
                    var(--pink),
                    var(--purple)
                );

            font-size: 9px;

            font-weight: 900;

            letter-spacing: 1px;

            box-shadow:
                0 0 20px
                rgba(255,46,166,0.35);
        }


        /* =========================================================
           SELECTED DESIGN BAR
           ========================================================= */

        #selectedBox {
            display: none;

            position: sticky;

            bottom: 20px;

            z-index: 100;

            align-items: center;

            justify-content: space-between;

            gap: 20px;

            margin-top: 40px;

            padding:
                17px 20px;

            border:
                1px solid
                rgba(255,46,166,0.30);

            border-radius: 15px;

            background:
                rgba(7,9,15,0.93);

            backdrop-filter:
                blur(16px);

            box-shadow:
                0 0 35px
                rgba(255,46,166,0.10),

                0 20px 55px
                rgba(0,0,0,0.60);
        }

        #selectedBox.show {
            display: flex;
        }

        .selected-details {
            color: var(--muted);

            font-size: 14px;
        }

        .selected-details strong {
            color: white;
        }

        .selected-details span {
            color: var(--pink);

            font-weight: 900;
        }


        /* =========================================================
           CONTINUE BUTTON
           ========================================================= */

        #continueBtn {
            padding:
                12px 23px;

            border: none;

            border-radius: 8px;

            color: white;

            background:
                linear-gradient(
                    90deg,
                    var(--pink),
                    var(--purple)
                );

            font-size: 13px;

            font-weight: 900;

            cursor: pointer;

            box-shadow:
                0 0 25px
                rgba(255,46,166,0.20);

            transition:
                0.25s ease;

            white-space: nowrap;
        }

        #continueBtn:hover {
            transform:
                translateY(-2px);

            filter:
                brightness(1.12);

            box-shadow:
                0 0 30px
                rgba(255,46,166,0.38);
        }


        /* =========================================================
           LIGHTBOX
           ========================================================= */

        #lightbox {
            display: none;

            position: fixed;

            inset: 0;

            z-index: 1000;

            align-items: center;

            justify-content: center;

            padding: 25px;

            background:
                rgba(2,3,7,0.96);
        }

        #lightbox.show {
            display: flex;
        }

        #lightbox img {
            max-width: 94vw;

            max-height: 88vh;

            object-fit: contain;

            border-radius: 12px;

            box-shadow:
                0 0 50px
                rgba(255,46,166,0.15),

                0 25px 80px
                rgba(0,0,0,0.80);
        }

        #lightbox .close-hint {
            position: absolute;

            top: 15px;

            right: 28px;

            color: white;

            font-size: 40px;

            font-weight: 300;

            cursor: pointer;

            opacity: 0.75;

            transition:
                0.2s ease;
        }

        #lightbox .close-hint:hover {
            color: var(--pink);

            opacity: 1;

            text-shadow:
                0 0 18px
                rgba(255,46,166,0.65);
        }


        /* =========================================================
           LOADING
           ========================================================= */

        .loading {
            grid-column: 1 / -1;

            padding:
                90px 20px;

            text-align: center;

            color: var(--muted);

            font-size: 15px;
        }


        /* =========================================================
           ERROR
           ========================================================= */

        .error {
            grid-column: 1 / -1;

            padding:
                70px 20px;

            text-align: center;

            color: #ff8292;
        }


        /* =========================================================
           TABLET
           ========================================================= */

        @media (max-width: 1050px) {

            #gallery {
                grid-template-columns:
                    repeat(3, minmax(0, 1fr));
            }

        }


        /* =========================================================
           MOBILE
           ========================================================= */

        @media (max-width: 700px) {

            .page {
                width: 94%;

                padding:
                    35px 0 80px;
            }

            .topbar {
                margin-bottom: 40px;
            }

            h1 {
                font-size: 40px;

                letter-spacing: -2px;
            }

            .subtitle {
                font-size: 14px;
            }

            #gallery {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));

                gap: 14px;
            }

            .design-btn img {
                height: 190px;

                padding: 6px;
            }

            .design-info {
                padding:
                    13px 5px 7px;
            }

            .design-btn .name {
                font-size: 13px;
            }

            .design-btn .price {
                font-size: 11px;

                padding:
                    5px 8px;
            }

            #selectedBox.show {
                flex-direction: column;

                align-items: stretch;
            }

            #continueBtn {
                width: 100%;
            }

        }


        /* =========================================================
           SMALL MOBILE
           ========================================================= */

        @media (max-width: 430px) {

            #gallery {
                grid-template-columns: 1fr;
            }

            .design-btn img {
                height: 235px;
            }

            h1 {
                font-size: 35px;
            }

        }


        /* =========================================================
           REDUCE MOTION
           ========================================================= */

        @media (prefers-reduced-motion: reduce) {

            * {
                scroll-behavior: auto !important;

                transition: none !important;
            }

        }

    </style>

</head>


<body>


<div class="page">


    <!-- =====================================================
         TOP BAR
         ===================================================== -->

    <div class="topbar">

        <a
            href="/"
            class="brand"
        >
            Stic<span>King</span>
        </a>

        <a
            href="/"
            class="home-link"
        >
            ← Back to Home
        </a>

    </div>


    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header class="header">

        <div class="eyebrow">
            STICKING COLLECTION
        </div>


        <h1 id="pageTitle">

            Choose Your
            <span>Design.</span>

        </h1>


        <p
            class="subtitle"
            id="pageSub"
        >

            Select a premium automotive design
            and see the details before moving forward.

        </p>

    </header>


    <!-- =====================================================
         COLLECTION DIVIDER
         ===================================================== -->

    <div class="collection-line">

        <span>
            Premium Automotive Decals
        </span>

    </div>


    <!-- =====================================================
         GALLERY
         ===================================================== -->

    <div id="gallery">

        <div class="loading">

            Loading designs...

        </div>

    </div>


    <!-- =====================================================
         SELECTED DESIGN
         ===================================================== -->

    <div id="selectedBox">

        <div class="selected-details">

            <strong>
                Selected:
            </strong>

            <span id="selectedName"></span>

            &nbsp; · &nbsp;

            <span id="selectedPrice"></span>

        </div>


        <button id="continueBtn">

            Continue →

        </button>

    </div>


</div>


<!-- =====================================================
     LIGHTBOX
     ===================================================== -->

<div id="lightbox">

    <span class="close-hint">
        &times;
    </span>


    <img
        id="lightboxImg"
        src=""
        alt="Design preview"
    >

</div>


<script>


/* =========================================================
   SELECTED DESIGN
   ========================================================= */

let selectedDesign = null;


/* =========================================================
   LIGHTBOX
   ========================================================= */

function openLightbox(
    imageUrl,
    altText
) {

    const lightbox =
        document.getElementById(
            "lightbox"
        );

    const lightboxImg =
        document.getElementById(
            "lightboxImg"
        );


    lightboxImg.src =
        imageUrl;

    lightboxImg.alt =
        altText;


    lightbox.classList.add(
        "show"
    );
}


function closeLightbox() {

    document
        .getElementById(
            "lightbox"
        )
        .classList.remove(
            "show"
        );
}


/* Close lightbox */

document
    .getElementById(
        "lightbox"
    )
    .addEventListener(
        "click",
        closeLightbox
    );


/* =========================================================
   CLOSE WITH ESC
   ========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key ===
            "Escape"
        ) {

            closeLightbox();

        }

    }
);


/* =========================================================
   CATEGORY INFORMATION
   ========================================================= */

const categoryInfo = {

    "car-skin": {

        title:
            'Car Skin <span>Collection.</span>',

        subtitle:
            'Premium vehicle skins and automotive graphics designed to turn your car into a statement.'

    },


    "windshield-window": {

        title:
            'Windshield & Window <span>Collection.</span>',

        subtitle:
            'Clean windshield and window decals designed to add personality without overwhelming visibility.'

    },


    "body-sticker": {

        title:
            'Body Sticker <span>Collection.</span>',

        subtitle:
            'Compact automotive stickers, symbols and graphics made for doors, panels and bodywork.'

    },


    "bike-decal": {

        title:
            'Bike Decal <span>Collection.</span>',

        subtitle:
            'Premium motorcycle decals for tanks, side panels, fairings and custom bike styling.'

    }

};


/* =========================================================
   GET CATEGORY FROM URL
   ========================================================= */

const params =
    new URLSearchParams(
        window.location.search
    );


const selectedCategory =
    params.get(
        "category"
    );


/* =========================================================
   UPDATE PAGE TITLE
   ========================================================= */

if (
    selectedCategory &&
    categoryInfo[
        selectedCategory
    ]
) {

    const info =
        categoryInfo[
            selectedCategory
        ];


    document
        .getElementById(
            "pageTitle"
        )
        .innerHTML =
            info.title;


    document
        .getElementById(
            "pageSub"
        )
        .innerHTML =
            info.subtitle +
            ' <a class="back-link" href="/gallery.html">View all designs →</a>';

}


/* =========================================================
   LOAD DESIGNS
   ========================================================= */

fetch(
    "/designs.json"
)


    .then(
        function(res) {

            if (!res.ok) {

                throw new Error(
                    "Unable to load designs"
                );

            }

            return res.json();

        }
    )


    .then(
        function(designs) {

            const gallery =
                document.getElementById(
                    "gallery"
                );


            gallery.innerHTML =
                "";


            /* =================================================
               FILTER CATEGORY
               ================================================= */

            const filtered =
                selectedCategory

                    ? designs.filter(
                        function(design) {

                            return (
                                design.category ===
                                selectedCategory
                            );

                        }
                    )

                    : designs;


            /* =================================================
               NO DESIGNS
               ================================================= */

            if (
                !filtered.length
            ) {

                gallery.innerHTML =
                    '<div class="error">No designs found in this collection yet.</div>';

                return;

            }


            /* =================================================
               CREATE CARDS
               ================================================= */

            filtered.forEach(
                function(design) {


                    const btn =
                        document.createElement(
                            "div"
                        );


                    btn.className =
                        "design-btn";


                    btn.dataset.id =
                        design.id;


                    btn.innerHTML = `

                        <div class="image-shine"></div>

                        <img
                            src="${design.imageUrl}"
                            alt="${design.name}"
                            loading="lazy"
                        >

                        <div class="design-info">

                            <div class="name">
                                ${design.name}
                            </div>

                            <div class="price">
                                ${design.price}
                            </div>

                        </div>

                    `;


                    /* =========================================
                       SELECT DESIGN
                       ========================================= */

                    btn.addEventListener(
                        "click",
                        function() {

                            selectDesign(
                                design,
                                btn
                            );

                        }
                    );


                    gallery.appendChild(
                        btn
                    );


                    /* =========================================
                       IMAGE LIGHTBOX
                       ========================================= */

                    const img =
                        btn.querySelector(
                            "img"
                        );


                    img.addEventListener(
                        "click",
                        function(event) {

                            event.stopPropagation();


                            openLightbox(
                                design.imageUrl,
                                design.name
                            );

                        }
                    );

                }
            );

        }
    )


    /* =====================================================
       ERROR HANDLING
       ===================================================== */

    .catch(
        function(error) {

            console.error(
                error
            );


            document
                .getElementById(
                    "gallery"
                )
                .innerHTML =
                    '<div class="error">Couldn’t load the designs. Please check that designs.json is available.</div>';

        }
    );


/* =========================================================
   SELECT DESIGN
   ========================================================= */

function selectDesign(
    design,
    btnEl
) {

    selectedDesign =
        design;


    /* Remove old selection */

    document
        .querySelectorAll(
            ".design-btn"
        )
        .forEach(
            function(button) {

                button.classList.remove(
                    "selected"
                );

            }
        );


    /* Add new selection */

    btnEl.classList.add(
        "selected"
    );


    /* Selected name */

    document
        .getElementById(
            "selectedName"
        )
        .textContent =
            design.name;


    /* Selected price */

    document
        .getElementById(
            "selectedPrice"
        )
        .textContent =
            design.price;


    /* Show selection bar */

    document
        .getElementById(
            "selectedBox"
        )
        .classList.add(
            "show"
        );

}


/* =========================================================
   CONTINUE BUTTON
   ========================================================= */

document
    .getElementById(
        "continueBtn"
    )
    .addEventListener(
        "click",
        function() {


            if (
                !selectedDesign
            ) {

                return;

            }


            /* Save selected design */

            localStorage.setItem(
                "chosenDesign",
                JSON.stringify(
                    selectedDesign
                )
            );


            /*
             * Keep your existing behavior.
             *
             * When you are ready to connect this
             * to your vehicle customizer, you can
             * change this alert to:
             *
             * window.location.href =
             * "/upload.html";
             */


            alert(
                "Design saved: " +
                selectedDesign.name
            );

        }
    );
