<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SticKing — Design Collection</title>

    <style>

        /* =====================================================
           STICKING NEON THEME
           ===================================================== */

        :root {
            --bg: #05060a;
            --bg2: #090b12;

            --panel: #0d1018;
            --panel2: #111520;

            --cyan: #00fff0;
            --cyan-dark: #00cfc3;

            --pink: #ff2e9f;
            --purple: #9b5cff;

            --white: #f7f9ff;
            --muted: #929aaa;

            --border: rgba(255,255,255,0.09);

            --cyan-glow:
                0 0 8px rgba(0,255,240,.45),
                0 0 22px rgba(0,255,240,.18);

            --pink-glow:
                0 0 8px rgba(255,46,159,.45),
                0 0 25px rgba(255,46,159,.18);
        }


        /* =====================================================
           GLOBAL
           ===================================================== */

        * {
            box-sizing: border-box;
        }

        html {
            background: var(--bg);
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            padding: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: var(--white);

            background:
                radial-gradient(
                    circle at 15% 0%,
                    rgba(0,255,240,.10),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 85% 10%,
                    rgba(255,46,159,.09),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 50% 100%,
                    rgba(155,92,255,.08),
                    transparent 35%
                ),

                linear-gradient(
                    135deg,
                    #05060a,
                    #080a11 50%,
                    #05060a
                );

            min-height: 100vh;
        }


        /* =====================================================
           NEON BACKGROUND GRID
           ===================================================== */

        body::before {

            content: "";

            position: fixed;

            inset: 0;

            pointer-events: none;

            opacity: .18;

            background-image:

                linear-gradient(
                    rgba(0,255,240,.035) 1px,
                    transparent 1px
                ),

                linear-gradient(
                    90deg,
                    rgba(0,255,240,.035) 1px,
                    transparent 1px
                );

            background-size: 50px 50px;

            mask-image:
                linear-gradient(
                    to bottom,
                    black,
                    transparent 85%
                );
        }


        /* =====================================================
           MAIN PAGE
           ===================================================== */

        .page {

            width: min(1200px, 92%);

            margin: 0 auto;

            padding:
                70px 0 90px;

            position: relative;

            z-index: 1;
        }


        /* =====================================================
           HEADER
           ===================================================== */

        .header {

            text-align: center;

            margin-bottom: 55px;
        }


        .eyebrow {

            display: inline-flex;

            align-items: center;

            gap: 9px;

            margin-bottom: 18px;

            color: var(--cyan);

            font-size: 12px;

            font-weight: 800;

            letter-spacing: 4px;

            text-transform: uppercase;

            text-shadow:
                0 0 10px rgba(0,255,240,.55);
        }


        .eyebrow::before,
        .eyebrow::after {

            content: "";

            width: 28px;

            height: 1px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    var(--cyan)
                );

            box-shadow:
                0 0 8px var(--cyan);
        }


        .eyebrow::after {

            background:
                linear-gradient(
                    90deg,
                    var(--cyan),
                    transparent
                );
        }


        h1 {

            margin: 0;

            color: var(--white);

            font-size:
                clamp(38px, 5vw, 62px);

            line-height: 1.02;

            font-weight: 900;

            letter-spacing: -2px;

            text-shadow:
                0 0 25px rgba(255,255,255,.04);
        }


        h1 span {

            color: var(--cyan);

            text-shadow:
                0 0 8px rgba(0,255,240,.65),
                0 0 25px rgba(0,255,240,.25);
        }


        .subtitle {

            max-width: 680px;

            margin:
                20px auto 0;

            color: var(--muted);

            font-size: 16px;

            line-height: 1.7;
        }


        .back-link {

            display: inline-block;

            margin-top: 18px;

            color: var(--cyan);

            font-size: 14px;

            font-weight: 700;

            text-decoration: none;

            transition:
                .25s ease;

            text-shadow:
                0 0 8px rgba(0,255,240,.25);
        }


        .back-link:hover {

            color: white;

            text-shadow:
                0 0 12px var(--cyan);
        }


        /* =====================================================
           CATEGORY ACCENT
           ===================================================== */

        body.bike-category h1 span {

            color: var(--pink);

            text-shadow:
                0 0 10px rgba(255,46,159,.65),
                0 0 30px rgba(255,46,159,.25);
        }


        body.bike-category .eyebrow {

            color: var(--pink);

            text-shadow:
                0 0 10px rgba(255,46,159,.55);
        }


        body.bike-category .eyebrow::before,
        body.bike-category .eyebrow::after {

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    var(--pink)
                );

            box-shadow:
                0 0 8px var(--pink);
        }


        /* =====================================================
           GALLERY
           ===================================================== */

        #gallery {

            display: grid;

            grid-template-columns:
                repeat(4, minmax(0, 1fr));

            gap: 22px;

            margin-top: 35px;
        }


        /* =====================================================
           DESIGN CARD
           ===================================================== */

        .design-btn {

            position: relative;

            overflow: hidden;

            cursor: pointer;

            border-radius: 18px;

            background:
                linear-gradient(
                    145deg,
                    rgba(18,23,34,.96),
                    rgba(7,10,16,.98)
                );

            border:
                1px solid
                rgba(255,255,255,.08);

            box-shadow:
                0 15px 40px rgba(0,0,0,.35);

            transition:
                transform .3s ease,
                border-color .3s ease,
                box-shadow .3s ease;
        }


        .design-btn::before {

            content: "";

            position: absolute;

            inset: 0;

            pointer-events: none;

            background:
                linear-gradient(
                    135deg,
                    rgba(0,255,240,.08),
                    transparent 35%,
                    rgba(255,46,159,.06)
                );

            opacity: .7;
        }


        .design-btn::after {

            content: "";

            position: absolute;

            top: -100%;

            left: -80%;

            width: 60%;

            height: 300%;

            transform:
                rotate(25deg);

            background:
                linear-gradient(
                    transparent,
                    rgba(255,255,255,.10),
                    transparent
                );

            transition:
                left .6s ease;

            pointer-events: none;
        }


        .design-btn:hover {

            transform:
                translateY(-8px);

            border-color:
                rgba(0,255,240,.48);

            box-shadow:
                0 0 0 1px
                    rgba(0,255,240,.12),

                0 0 20px
                    rgba(0,255,240,.16),

                0 22px 55px
                    rgba(0,0,0,.55);
        }


        .design-btn:hover::after {

            left: 130%;
        }


        /* =====================================================
           DESIGN IMAGE
           ===================================================== */

        .design-btn img {

            display: block;

            width: 100%;

            aspect-ratio: 1 / 1;

            object-fit: cover;

            background:
                radial-gradient(
                    circle,
                    #171c27,
                    #090b10
                );

            transition:
                transform .35s ease,
                filter .35s ease;
        }


        .design-btn:hover img {

            transform: scale(1.035);

            filter:
                brightness(1.08)
                saturate(1.08);
        }


        /* =====================================================
           DESIGN INFORMATION
           ===================================================== */

        .design-info {

            position: relative;

            padding:
                17px 18px 19px;

            background:
                linear-gradient(
                    180deg,
                    rgba(16,21,31,.98),
                    rgba(8,11,17,.98)
                );
        }


        .name {

            color: var(--white);

            font-size: 16px;

            font-weight: 800;

            line-height: 1.3;

            margin-bottom: 10px;
        }


        .price {

            display: inline-block;

            padding:
                5px 10px;

            border-radius: 7px;

            color: var(--cyan);

            background:
                rgba(0,255,240,.07);

            border:
                1px solid
                rgba(0,255,240,.18);

            font-size: 13px;

            font-weight: 800;

            text-shadow:
                0 0 8px
                rgba(0,255,240,.45);
        }


        /* =====================================================
           SELECTED CARD
           ===================================================== */

        .design-btn.selected {

            border-color:
                var(--cyan);

            box-shadow:

                0 0 0 1px
                    rgba(0,255,240,.35),

                0 0 18px
                    rgba(0,255,240,.35),

                0 0 45px
                    rgba(0,255,240,.12);
        }


        .design-btn.selected::before {

            background:
                linear-gradient(
                    135deg,
                    rgba(0,255,240,.14),
                    transparent 45%,
                    rgba(255,46,159,.08)
                );
        }


        .design-btn.selected .name {

            color: var(--cyan);

            text-shadow:
                0 0 8px
                rgba(0,255,240,.25);
        }


        /* =====================================================
           SELECTED DESIGN BOX
           ===================================================== */

        #selectedBox {

            display: none;

            align-items: center;

            justify-content: space-between;

            gap: 20px;

            margin-top: 35px;

            padding:
                18px 20px;

            border-radius: 15px;

            background:
                linear-gradient(
                    135deg,
                    rgba(13,18,27,.97),
                    rgba(7,10,16,.97)
                );

            border:
                1px solid
                rgba(0,255,240,.25);

            box-shadow:

                0 0 18px
                    rgba(0,255,240,.08),

                0 20px 45px
                    rgba(0,0,0,.35);

            backdrop-filter:
                blur(12px);
        }


        #selectedBox.show {

            display: flex;
        }


        .selected-details {

            color: var(--muted);

            font-size: 14px;
        }


        .selected-details strong {

            color: white;
        }


        #selectedName {

            color: var(--cyan);

            font-weight: 800;

            text-shadow:
                0 0 8px
                rgba(0,255,240,.3);
        }


        #selectedPrice {

            color: white;

            font-weight: 800;
        }


        /* =====================================================
           CONTINUE BUTTON
           ===================================================== */

        #continueBtn {

            border: 0;

            border-radius: 9px;

            padding:
                12px 23px;

            cursor: pointer;

            color: #020607;

            background:
                linear-gradient(
                    135deg,
                    var(--cyan),
                    #00cfc3
                );

            font-size: 14px;

            font-weight: 900;

            box-shadow:
                0 0 15px
                    rgba(0,255,240,.3);

            transition:
                transform .25s ease,
                box-shadow .25s ease;
        }


        #continueBtn:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 0 12px
                    rgba(0,255,240,.65),

                0 0 30px
                    rgba(0,255,240,.25);
        }


        /* =====================================================
           LIGHTBOX
           ===================================================== */

        #lightbox {

            position: fixed;

            inset: 0;

            z-index: 9999;

            display: none;

            align-items: center;

            justify-content: center;

            padding: 30px;

            background:
                rgba(0,0,0,.88);

            backdrop-filter:
                blur(10px);
        }


        #lightbox.show {

            display: flex;
        }


        #lightboxImg {

            max-width: min(900px, 94vw);

            max-height: 88vh;

            object-fit: contain;

            border-radius: 15px;

            border:
                1px solid
                rgba(0,255,240,.35);

            box-shadow:

                0 0 20px
                    rgba(0,255,240,.25),

                0 0 70px
                    rgba(0,0,0,.7);
        }


        .close-hint {

            position: fixed;

            top: 22px;

            right: 28px;

            color: white;

            font-size: 34px;

            font-weight: 300;

            cursor: pointer;

            opacity: .75;

            transition:
                opacity .2s ease,
                color .2s ease;
        }


        .close-hint:hover {

            opacity: 1;

            color: var(--cyan);

            text-shadow:
                0 0 12px var(--cyan);
        }


        /* =====================================================
           LOADING
           ===================================================== */

        .loading {

            grid-column:
                1 / -1;

            padding:
                80px 20px;

            text-align: center;

            color: var(--muted);

            font-size: 15px;
        }


        .loading::after {

            content: "";

            display: block;

            width: 34px;

            height: 34px;

            margin:
                20px auto 0;

            border-radius: 50%;

            border:
                2px solid
                rgba(0,255,240,.15);

            border-top-color:
                var(--cyan);

            animation:
                spin .8s linear infinite;

            box-shadow:
                0 0 12px
                rgba(0,255,240,.25);
        }


        @keyframes spin {

            to {
                transform: rotate(360deg);
            }
        }


        /* =====================================================
           ERROR
           ===================================================== */

        .error {

            grid-column:
                1 / -1;

            padding:
                60px 20px;

            text-align: center;

            color: #ff8797;

            background:
                rgba(255,46,80,.04);

            border:
                1px solid
                rgba(255,46,80,.15);

            border-radius: 14px;
        }


        /* =====================================================
           MOBILE
           ===================================================== */

        @media (max-width: 1000px) {

            #gallery {

                grid-template-columns:
                    repeat(3, minmax(0,1fr));
            }
        }


        @media (max-width: 700px) {

            .page {

                width: 94%;

                padding-top: 45px;
            }


            h1 {

                font-size: 40px;
            }


            #gallery {

                grid-template-columns:
                    repeat(2, minmax(0,1fr));

                gap: 14px;
            }


            #selectedBox.show {

                flex-direction: column;

                align-items: stretch;
            }


            #continueBtn {

                width: 100%;
            }
        }


        @media (max-width: 430px) {

            #gallery {

                grid-template-columns: 1fr;
            }


            .design-btn img {

                aspect-ratio:
                    1.15 / 1;
            }
        }

    </style>

</head>


<body>

<div class="page">


    <!-- =================================================
         HEADER
         ================================================= -->

    <header class="header">

        <div class="eyebrow">
            STICKING COLLECTION
        </div>

        <h1 id="pageTitle">
            Choose Your <span>Design.</span>
        </h1>

        <p
            class="subtitle"
            id="pageSub"
        >
            Select a design to see how it looks before moving forward.
        </p>

    </header>


    <!-- =================================================
         GALLERY
         ================================================= -->

    <div id="gallery">

        <div class="loading">
            Loading designs...
        </div>

    </div>


    <!-- =================================================
         SELECTED DESIGN
         ================================================= -->

    <div id="selectedBox">

        <div class="selected-details">

            <strong>Selected:</strong>

            <span id="selectedName"></span>

            &nbsp; · &nbsp;

            <span id="selectedPrice"></span>

        </div>


        <button id="continueBtn">

            Continue →

        </button>

    </div>


</div>


<!-- =====================================================
     LIGHTBOX
     ===================================================== -->

<div id="lightbox">

    <span class="close-hint">
        &times;
    </span>

    <img
        id="lightboxImg"
        src=""
        alt="Design preview"
    >

</div>


<script>

let selectedDesign = null;


/* =====================================================
   LIGHTBOX
   ===================================================== */

function openLightbox(
    imageUrl,
    altText
) {

    const lightboxImg =
        document.getElementById(
            "lightboxImg"
        );

    lightboxImg.src =
        imageUrl;

    lightboxImg.alt =
        altText;

    document
        .getElementById("lightbox")
        .classList.add("show");
}


function closeLightbox() {

    document
        .getElementById("lightbox")
        .classList.remove("show");
}


document
    .getElementById("lightbox")
    .addEventListener(
        "click",
        closeLightbox
    );


/* =====================================================
   CATEGORY
   ===================================================== */

const categoryTitles = {

    "car-skin":
        "Car Skin <span>Collection.</span>",

    "windshield-window":
        "Windshield & Window <span>Collection.</span>",

    "body-sticker":
        "Body Sticker <span>Collection.</span>",

    "bike-decal":
        "Bike Decal <span>Collection.</span>"
};


const params =
    new URLSearchParams(
        window.location.search
    );


const selectedCategory =
    params.get("category");


/* Give Bike Decal pages their special accent */

if (
    selectedCategory ===
    "bike-decal"
) {

    document.body.classList.add(
        "bike-category"
    );
}


if (
    selectedCategory &&
    categoryTitles[selectedCategory]
) {

    document
        .getElementById("pageTitle")
        .innerHTML =
        categoryTitles[
            selectedCategory
        ];


    document
        .getElementById("pageSub")
        .innerHTML =
        'Choose a design below. <a class="back-link" href="/gallery.html">View all designs →</a>';
}


/* =====================================================
   LOAD DESIGNS
   ===================================================== */

fetch("/designs.json")

    .then((res) => {

        if (!res.ok) {

            throw new Error(
                "Unable to load designs"
            );
        }

        return res.json();

    })

    .then((designs) => {

        const gallery =
            document.getElementById(
                "gallery"
            );


        gallery.innerHTML = "";


        const filtered =
            selectedCategory

                ? designs.filter(
                    (d) =>
                        d.category ===
                        selectedCategory
                )

                : designs;


        if (!filtered.length) {

            gallery.innerHTML =
                '<div class="error">No designs found in this collection yet.</div>';

            return;
        }


        filtered.forEach(
            (design) => {

                const btn =
                    document.createElement(
                        "div"
                    );


                btn.className =
                    "design-btn";


                btn.dataset.id =
                    design.id;


                btn.innerHTML = `

                    <img
                        src="${design.imageUrl}"
                        alt="${design.name}"
                        loading="lazy"
                    >

                    <div class="design-info">

                        <div class="name">
                            ${design.name}
                        </div>

                        <div class="price">
                            ${design.price}
                        </div>

                    </div>

                `;


                /* Select design */

                btn.addEventListener(
                    "click",
                    () =>
                        selectDesign(
                            design,
                            btn
                        )
                );


                gallery.appendChild(
                    btn
                );


                /* Full-size preview */

                const img =
                    btn.querySelector(
                        "img"
                    );


                img.addEventListener(
                    "click",
                    (e) => {

                        e.stopPropagation();


                        openLightbox(
                            design.imageUrl,
                            design.name
                        );

                    }
                );

            }
        );

    })

    .catch((error) => {

        console.error(error);


        document
            .getElementById("gallery")
            .innerHTML =
            '<div class="error">Couldn’t load the designs. Please try again.</div>';

    });


/* =====================================================
   SELECT DESIGN
   ===================================================== */

function selectDesign(
    design,
    btnEl
) {

    selectedDesign =
        design;


    document
        .querySelectorAll(
            ".design-btn"
        )
        .forEach(
            (b) =>
                b.classList.remove(
                    "selected"
                )
        );


    btnEl.classList.add(
        "selected"
    );


    document
        .getElementById(
            "selectedName"
        )
        .textContent =
        design.name;


    document
        .getElementById(
            "selectedPrice"
        )
        .textContent =
        design.price;


    document
        .getElementById(
            "selectedBox"
        )
        .classList.add(
            "show"
        );

}


/* =====================================================
   CONTINUE
   ===================================================== */

document
    .getElementById(
        "continueBtn"
    )
    .addEventListener(
        "click",
        () => {

            if (!selectedDesign)
                return;


            localStorage.setItem(
                "chosenDesign",
                JSON.stringify(
                    selectedDesign
                )
            );


            alert(
                "Design saved: " +
                selectedDesign.name
            );


            /*
             * When your customization
             * tool is ready, replace the
             * alert above with:
             *
             * window.location.href =
             * "/upload.html";
             */

        }
    );

</script>

</body>

</html>
